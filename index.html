  hbSentence()+
  hbT(['Theo cấu tạo','Nhận diện'],[['Câu đơn','một cụm C–V nòng cốt'],['Câu ghép','từ hai cụm C–V trở lên; đẳng lập (ngang hàng) hoặc chính phụ (vì… nên, nếu… thì, tuy… nhưng, càng… càng)'],['Câu rút gọn','lược thành phần, khôi phục được theo ngữ cảnh'],['Câu đặc biệt','không theo mô hình C–V; nêu thời gian, nơi chốn, liệt kê, bộc lộ cảm xúc, gọi đáp']])+
  hbT(['Theo mục đích','Dấu hiệu'],[['Nghi vấn','ai, gì, sao, không, chưa…; dấu chấm hỏi; có thể dùng để khẳng định, phủ định, bộc lộ cảm xúc'],['Cầu khiến','hãy, đừng, chớ…; ra lệnh, yêu cầu, khuyên bảo'],['Cảm thán','ôi, chao ôi, biết bao, làm sao…; bộc lộ cảm xúc'],['Trần thuật','kể, nhận xét, thông báo; dấu chấm']])+
  hbT(['Theo ý nghĩa','Ghi nhớ'],[['Phủ định','không, chưa, đâu có…; phủ định miêu tả hoặc bác bỏ'],['Khẳng định','không có từ phủ định; phủ định hai lần ("không thể không") là khẳng định mạnh'],['Chủ động / bị động','bị động khi chủ ngữ chịu tác động và đổi được thành câu chủ động tương ứng; không phải câu nào có "bị/được" cũng là bị động']])},
 {id:'tutu',part:'Tiếng Việt',t:'Biện pháp tu từ',body:()=>
  hbBox('Công thức trả lời tác dụng','Bước 1: gọi tên biện pháp và chỉ rõ từ ngữ thể hiện. Bước 2: nêu tác dụng — về hình thức (gợi hình, gợi cảm, sinh động, tạo nhịp điệu…), về nội dung (nhấn mạnh, làm rõ điều gì), về tình cảm (bộc lộ thái độ, cảm xúc của người viết).','key')+
  hbCards([
   ['So sánh','đối chiếu hai sự vật có nét giống nhau','Thân em như ớt trên cây (ca dao)','gợi hình, gợi cảm'],
   ['Nhân hóa','gọi, tả, trò chuyện với vật như với người (3 kiểu)','Trâu ơi ta bảo trâu này (ca dao)','vật gần gũi, mang tình người'],
   ['Ẩn dụ','gọi tên bằng sự vật khác có nét tương đồng; 4 kiểu: hình thức, cách thức, phẩm chất, chuyển đổi cảm giác','Thuyền về có nhớ bến chăng (ca dao)','hàm súc, kín đáo'],
   ['Hoán dụ','gọi tên bằng sự vật gần gũi; 4 kiểu: bộ phận – toàn thể, vật chứa – vật bị chứa, dấu hiệu – sự vật, cụ thể – trừu tượng','Cả làng thức dậy đi xem hội','nhấn vào nét tiêu biểu'],
   ['Nói quá','phóng đại mức độ','Lỗ mũi mười tám gánh lông (ca dao)','nhấn mạnh, gây ấn tượng, gây cười'],
   ['Nói giảm nói tránh','diễn đạt tế nhị, uyển chuyển','Ông đã về với tổ tiên','tránh đau buồn, lịch sự'],
   ['Điệp ngữ','lặp từ ngữ; cách quãng, nối tiếp, chuyển tiếp (vòng)','Buồn trông… / Buồn trông… (Truyện Kiều)','nhấn mạnh, tạo nhịp, liên kết'],
   ['Điệp thanh, điệp vần','lặp thanh cùng loại / lặp vần','Sông xanh trôi êm đềm mênh mông','tăng nhạc tính'],
   ['Liệt kê','sắp xếp hàng loạt từ, cụm từ cùng loại','Học ăn, học nói, học gói, học mở','diễn tả đầy đủ, nhấn mạnh'],
   ['Chơi chữ','đồng âm, gần âm, điệp âm, nói lái, trái nghĩa…','Lợi thì có lợi nhưng răng không còn (ca dao)','dí dỏm, bất ngờ'],
   ['Đảo ngữ','đưa vị ngữ, phụ ngữ lên trước','Lom khom dưới núi tiều vài chú (Bà Huyện Thanh Quan)','nhấn mạnh hình ảnh, cảm xúc'],
   ['Đối lập, đối xứng','đặt hình ảnh trái ngược / cân xứng cạnh nhau','Bên lở… bên bồi (ca dao)','làm nổi bật, tạo cân đối'],
   ['Câu hỏi tu từ','hỏi không cần trả lời','Đèn có biết dường bằng chẳng biết (Chinh phụ ngâm)','khẳng định, phủ định, bộc lộ cảm xúc'],
   ['Tăng cấp','chi tiết sau mạnh hơn chi tiết trước','khóc nức nở, khóc nấc lên, khóc như người ta thổ','làm rõ mức độ, cao trào']])},
 {id:'vb',part:'Tiếng Việt',t:'Dẫn, hàm ý, dấu câu, liên kết, đoạn văn',body:()=>
  hbT(['Cách dẫn','Đặc điểm'],[['Trực tiếp','nhắc nguyên văn; sau dấu hai chấm, trong ngoặc kép'],['Gián tiếp','thuật lại có điều chỉnh; không dùng ngoặc kép; có thể thêm "rằng", "là"']])+
  hbBox('Nghĩa tường minh – hàm ý','Tường minh: nói thẳng bằng từ ngữ ("Không, mình không đi được"). Hàm ý: không nói thẳng nhưng suy ra được ("Mình bận ôn thi" → hàm ý từ chối).')+
  hbT(['Dấu câu','Công dụng chính'],[['Chấm phẩy ;','ranh giới các vế câu ghép phức tạp, các bộ phận liệt kê phức tạp'],['Ba chấm …','liệt kê chưa hết, lời ngập ngừng, chuẩn bị cho ý bất ngờ'],['Hai chấm :','báo hiệu lời nói, lời giải thích'],['Ngoặc đơn ( )','đánh dấu phần chú thích'],['Ngoặc kép " "','lời dẫn trực tiếp, từ ngữ dùng với nghĩa đặc biệt'],['Gạch ngang –','lời thoại, ngăn cách phần chú thích']])+
  hbT(['Phép liên kết','Cách làm'],[['Lặp','lặp từ ngữ chủ đề ở câu sau'],['Thế','dùng đại từ hoặc từ tương đương thay thế (Nguyễn Du → tác giả)'],['Nối','dùng từ nối ở đầu câu: nhưng, vì vậy, tóm lại'],['Đồng nghĩa, trái nghĩa, liên tưởng','từ ngữ cùng trường nghĩa (tác phẩm – nghệ sĩ)']])+
  hbParas()+
  hbBox('Cước chú','Chú thích đặt ở chân trang hoặc cuối văn bản để giải thích từ khó hoặc ghi nguồn; gặp nhiều trong văn bản thông tin, nghị luận, văn học cổ.')},
 {id:'tho',part:'Thể loại',t:'Các thể thơ',body:()=>
  `<h4 class="hb-h">Lục bát</h4>`+hbLucBat()+
  `<h4 class="hb-h">Song thất lục bát</h4>`+hbSTLB()+
  hbT(['Thể thơ','Số chữ','Nhịp thường gặp'],[['Bốn chữ','4','2/2'],['Năm chữ','5','2/3, 3/2'],['Sáu chữ','6','2/2/2, 3/3'],['Bảy chữ','7','4/3'],['Tám chữ','8','linh hoạt: 3/5, 4/4, 3/2/3'],['Lục bát','6 – 8','chẵn: 2/2/2, 2/4, 4/4']])+
  `<h4 class="hb-h">Thất ngôn bát cú Đường luật</h4>`+hbDuong()+
  hbBox('Tứ tuyệt','4 câu, mỗi câu 5 hoặc 7 chữ; bố cục khởi – thừa – chuyển – hợp; vần bằng ở cuối câu 1, 2, 4.')+
  hbBox('Thơ trào phúng','Dùng tiếng cười để phê phán cái xấu: chơi chữ, khẩu ngữ, phóng đại, tương phản; lúc châm biếm nhẹ nhàng, lúc đả kích sâu cay.')+
  hbBox('Thơ tự do','Không quy định số tiếng, số dòng, vần linh hoạt; nhịp điệu do cảm xúc chi phối.')+
  hbT(['Yếu tố cần nắm','Hiểu ngắn gọn'],[['Nhân vật trữ tình','người trực tiếp bộc lộ cảm xúc trong bài thơ'],['Cảm hứng chủ đạo','cảm xúc bao trùm, xuyên suốt bài thơ'],['Mạch cảm xúc','diễn biến cảm xúc theo một trình tự'],['Vần','vần chân (cuối dòng), vần lưng (giữa dòng); vần liền, vần cách'],['Kết cấu, bố cục','cách tổ chức các khổ, các phần để bộc lộ cảm xúc']])},
 {id:'truyen',part:'Thể loại',t:'Truyện: ngôi kể, nhân vật, tình huống',body:()=>
  hbT(['Ngôi kể','Dấu hiệu','Tác dụng'],[['Thứ nhất','người kể xưng "tôi", tham gia câu chuyện','chân thực, dễ bộc lộ suy nghĩ, cảm xúc'],['Thứ ba','người kể giấu mình, gọi nhân vật bằng tên','khách quan; kể linh hoạt, bao quát nhiều sự việc, nhân vật']])+
  hbT(['Khái niệm','Cách xác định'],[['Lời người kể','không có gạch ngang đầu dòng hay ngoặc kép; dẫn dắt, tả, bình luận'],['Lời nhân vật','sau gạch ngang (đối thoại) hoặc trong ngoặc kép (độc thoại); thể hiện tính cách'],['Tình huống truyện','hoàn cảnh đặc biệt làm nảy sinh câu chuyện, bộc lộ tính cách, chủ đề'],['Đề tài','phạm vi đời sống được phản ánh (gia đình, chiến tranh…)'],['Chủ đề','vấn đề chính, thông điệp tác giả gửi gắm']])},
 {id:'doc',part:'Đọc hiểu',t:'Các dạng câu hỏi đọc hiểu',body:()=>
  hbPyramid()+
  hbT(['Dạng câu hỏi','Cách trả lời gọn'],[['Ngôi kể','gọi đúng ngôi + dấu hiệu (xưng "tôi" / giấu mình)'],['Tác dụng ngôi kể','nêu 2 tác dụng của ngôi đó, gắn với văn bản'],['Tình huống truyện','tóm tắt tình huống trong 1 câu: ai, gặp chuyện gì'],['Ý nghĩa chi tiết','vị trí chi tiết → làm rõ nhân vật → thể hiện chủ đề → ấn tượng với người đọc'],['Tác dụng biện pháp tu từ','gọi tên + chỉ rõ → tác dụng hình thức → nội dung → tình cảm'],['Bài học, thông điệp','nêu nội dung → bài học nhận thức → bài học hành động (2–3 việc cụ thể)'],['Đồng ý không, vì sao','nêu rõ quan điểm → ít nhất 2–3 lí do → kết luận']])+
  hbBox('Mẹo','Chép đúng từ ngữ trong ngữ liệu khi được hỏi "tìm chi tiết"; câu hỏi vận dụng cần lí lẽ ngắn gọn, đúng trọng tâm.','key')},
 {id:'nlvh',part:'Viết',t:'Đoạn văn nghị luận văn học',body:()=>
  hbFlow([['Mở đoạn','Giới thiệu tác giả, tác phẩm, đoạn trích; nêu nhận xét khái quát về nội dung. Bám sát yêu cầu đề.'],['Giới thiệu chung','Thơ: nhân vật trữ tình, đối tượng biểu cảm, cảm xúc chủ đạo. Truyện: nhân vật, tình huống.'],['Phân tích nội dung','Theo bố cục: trích dẫn từ ngữ, hình ảnh nổi bật → phân tích biện pháp nghệ thuật → chốt cảm xúc, ý nghĩa từng phần.'],['Đánh giá nghệ thuật','Thể thơ, hình ảnh, ngôn ngữ, biện pháp tu từ, giọng điệu — chỉ ra cái hay đã góp phần thể hiện nội dung.'],['Kết đoạn','Khẳng định chủ đề, tư tưởng; có thể liên hệ, nêu cảm nghĩ.']])+
  hbBox('Trích thơ đúng cách','Đặt trong ngoặc kép; hai dòng viết liền thì ngăn bằng dấu gạch chéo (/). Tránh kể lại tác phẩm, tránh nhận xét chung chung.')},
 {id:'nlxh',part:'Viết',t:'Bài văn nghị luận xã hội',body:()=>
  `<h4 class="hb-h">Dạng 1 · Nghị luận về một vấn đề</h4>`+hbFlow([['Mở bài','Giới thiệu vấn đề, nêu ý kiến đánh giá chung.'],['Giải thích','Giải thích từ ngữ, khái niệm → nghĩa của cả vấn đề.'],['Bàn luận','Biểu hiện / thực trạng → nguyên nhân (chủ quan, khách quan) → ích lợi hoặc hậu quả với cá nhân, gia đình, xã hội (có dẫn chứng).'],['Phản đề, mở rộng','Phản bác ý kiến trái chiều; phân biệt với khái niệm dễ nhầm.'],['Bài học','Nhận thức + hành động.'],['Kết bài','Khẳng định lại vấn đề, lời nhắn gửi, liên hệ bản thân.']])+
  `<h4 class="hb-h">Dạng 2 · Lựa chọn giữa hai ý kiến</h4>`+hbFlow([['Giải thích từng ý kiến','và kết luận mối quan hệ: bổ sung cho nhau hay đối lập.'],['Nêu quan điểm lựa chọn','chọn một hoặc dung hòa cả hai.'],['Chứng minh lựa chọn','ích lợi nếu làm theo ý kiến đã chọn, hậu quả nếu làm theo ý còn lại (với cá nhân, gia đình, xã hội; ít nhất 2 dẫn chứng).'],['Mở rộng và biện pháp','trường hợp nào ý kiến kia cũng đúng; cách thực hiện.']])+
  `<h4 class="hb-h">Dạng 3 · Vấn đề cần giải quyết (giải pháp)</h4>`+hbFlow([['Nêu vấn đề','và khẳng định tầm quan trọng của việc giải quyết.'],['Phân tích vấn đề','ích lợi nếu giải quyết, thực trạng, nguyên nhân, hậu quả nếu không giải quyết.'],['Phản biện','ý kiến trái chiều, khái niệm dễ nhầm.'],['Giải pháp (trọng tâm)','ít nhất 3 giải pháp cho các đối tượng: bản thân, gia đình – nhà trường, xã hội. Mỗi giải pháp: vì sao cần, thực hiện thế nào, dẫn chứng, hiệu quả.'],['Kết bài','khẳng định ý kiến, lời khuyên, bài học cho bản thân.']])}
];

const ON10=[
{t:'Từ và nghĩa của từ',s:'cấu tạo, nghĩa, nguồn gốc, từ loại',c:'#3B4CCA',gl:'Từ',hb:'tu',lessons:[
 {card:{h:'Từ: cấu tạo và nghĩa',p:'Theo cấu tạo: từ đơn (một tiếng), từ ghép (đẳng lập, chính phụ), từ láy (toàn bộ, bộ phận). Theo nghĩa: từ đa nghĩa (nghĩa gốc – nghĩa chuyển), đồng âm, đồng nghĩa, trái nghĩa; từ tượng hình, tượng thanh.'},qs:[
  {t:'mc',q:'"Quần áo" là loại từ gì theo cấu tạo?',o:['Từ ghép đẳng lập','Từ ghép chính phụ','Từ láy','Từ đơn'],a:0,w:'Hai tiếng "quần" và "áo" ngang hàng, đều có nghĩa.'},
  {t:'mc',q:'"Lung linh" là từ gì?',o:['Từ láy bộ phận','Từ láy toàn bộ','Từ ghép chính phụ','Từ đơn'],a:0,w:'Hai tiếng lặp lại phụ âm đầu "l", phần vần khác nhau.'},
  {t:'mc',q:'"Kiến bò đĩa thịt bò." Hai từ "bò" có quan hệ gì?',o:['Đồng âm','Đa nghĩa','Đồng nghĩa','Trái nghĩa'],a:0,w:'Âm giống nhau nhưng nghĩa không liên quan: một là động từ, một là danh từ.'},
  {t:'mc',q:'"Tuổi xuân" — từ "xuân" được dùng theo nghĩa nào?',o:['Nghĩa chuyển (theo phương thức ẩn dụ)','Nghĩa gốc','Nghĩa đồng âm','Nghĩa trái ngược'],a:0,w:'Từ mùa đầu năm đầy sức sống, chuyển sang chỉ tuổi trẻ.'},
  {t:'mc',q:'Từ nào là từ tượng thanh?',o:['Róc rách','Lom khom','Lênh khênh','Vời vợi'],a:0,w:'Róc rách mô phỏng âm thanh của nước chảy. Ba từ còn lại gợi hình dáng.'}]},
 {deep:1,card:{h:'Đào sâu: nguồn gốc, phạm vi, từ loại',p:'Từ mượn gồm từ Hán Việt và từ gốc Ấn – Âu. Theo phạm vi: từ toàn dân, từ địa phương, biệt ngữ xã hội, thuật ngữ. Chín từ loại: danh từ, động từ, tính từ, số từ, phó từ, đại từ, kết từ, trợ từ, thán từ.'},qs:[
  {t:'mc',q:'"Má, ba" (để gọi mẹ, cha) thuộc loại từ nào theo phạm vi sử dụng?',o:['Từ địa phương','Thuật ngữ','Biệt ngữ xã hội','Từ Hán Việt'],a:0,w:'Đây là cách gọi phổ biến ở Nam Bộ.'},
  {t:'mc',q:'"Ẩn dụ", "ba-zơ", "phân số" thuộc loại từ nào?',o:['Thuật ngữ','Từ địa phương','Thán từ','Từ láy'],a:0,w:'Thuật ngữ biểu thị khái niệm khoa học, dùng trong văn bản chuyên ngành.'},
  {t:'mc',q:'Trong câu "Ngay tôi cũng không biết.", từ "ngay" là từ loại gì?',o:['Trợ từ','Phó từ','Kết từ','Thán từ'],a:0,w:'"Ngay" nhấn mạnh từ ngữ đứng sau nó, là trợ từ.'},
  {t:'mc',q:'Trong "Nó đến trường bằng xe đạp.", từ "bằng" là gì?',o:['Kết từ (quan hệ từ)','Tính từ','Đại từ','Số từ'],a:0,w:'"Bằng" nối và chỉ quan hệ phương tiện.'},
  {t:'mc',q:'Vì sao văn bản trang trọng hay dùng từ Hán Việt?',o:['Tạo sắc thái trang trọng, cổ kính, tránh thô tục','Để câu ngắn hơn','Vì từ thuần Việt không có nghĩa','Để người đọc khó hiểu'],a:0,w:'Ví dụ "phu nhân" trang trọng hơn "vợ", "từ trần" tế nhị hơn "chết".'}]}]},
{t:'Câu',s:'thành phần câu, kiểu câu, chủ động – bị động',c:'#0E8F9B',gl:'C // V',hb:'cau',lessons:[
 {card:{h:'Thành phần câu',p:'Thành phần chính: chủ ngữ, vị ngữ. Thành phần phụ: trạng ngữ (thời gian, nơi chốn, nguyên nhân, mục đích…). Thành phần biệt lập: tình thái, cảm thán, phụ chú, gọi – đáp; không tham gia diễn đạt nghĩa sự việc của câu.',code:'Mùa xuân, cây cối // đâm chồi nảy lộc.'},qs:[
  {t:'mc',q:'Trong câu ở thẻ bí kíp, "Mùa xuân" là thành phần gì?',o:['Trạng ngữ chỉ thời gian','Chủ ngữ','Vị ngữ','Thành phần phụ chú'],a:0,w:'Nó đứng đầu câu, cho biết sự việc diễn ra khi nào.'},
  {t:'mc',q:'"Có lẽ trời sắp mưa." "Có lẽ" là thành phần gì?',o:['Tình thái','Cảm thán','Gọi – đáp','Phụ chú'],a:0,w:'Thể hiện cách nhìn, mức độ tin cậy của người nói.'},
  {t:'mc',q:'"Lan — bạn thân của tôi — học rất giỏi." Phần giữa hai dấu gạch ngang là gì?',o:['Thành phần phụ chú','Thành phần tình thái','Trạng ngữ','Vị ngữ'],a:0,w:'Phụ chú bổ sung thông tin, thường đặt giữa hai dấu gạch ngang, phẩy hoặc trong ngoặc đơn.'},
  {t:'mc',q:'"Anh Mên ơi, anh Mên!" chứa thành phần biệt lập nào?',o:['Gọi – đáp','Tình thái','Cảm thán','Phụ chú'],a:0,w:'Dùng để gọi, tạo lập quan hệ giao tiếp.'},
  {t:'bug',q:'Chạm vào phát biểu SAI',lines:['Bỏ thành phần biệt lập đi thì nghĩa sự việc của câu không đổi','Trạng ngữ có thể đứng đầu, giữa hoặc cuối câu','Chủ ngữ thường trả lời câu hỏi Ai? Cái gì? Con gì?','Thành phần cảm thán dùng để hỏi thông tin'],a:3,w:'Thành phần cảm thán bộc lộ tâm lí (vui, buồn, mừng…), không dùng để hỏi.'}]},
 {deep:1,card:{h:'Đào sâu: các kiểu câu',p:'Theo mục đích: nghi vấn, cầu khiến, cảm thán, trần thuật. Câu nghi vấn còn dùng để khẳng định, phủ định, bộc lộ cảm xúc. Theo ý nghĩa: khẳng định, phủ định; phủ định hai lần là khẳng định mạnh. Câu chủ động – bị động.'},qs:[
  {t:'mc',q:'"Hãy giữ gìn sự trong sáng của tiếng Việt!" là câu gì?',o:['Câu cầu khiến','Câu nghi vấn','Câu cảm thán','Câu trần thuật'],a:0,w:'Có từ "hãy", dùng để khuyên bảo, yêu cầu.'},
  {t:'mc',q:'"Chao ôi, cảnh hoàng hôn đẹp làm sao!" là câu gì?',o:['Câu cảm thán','Câu cầu khiến','Câu nghi vấn','Câu phủ định'],a:0,w:'Có "chao ôi", "làm sao", bộc lộ cảm xúc trực tiếp.'},
  {t:'mc',q:'"Tôi không thể không nhớ về ngôi trường cũ." là câu gì?',o:['Câu khẳng định (phủ định hai lần)','Câu phủ định bác bỏ','Câu phủ định miêu tả','Câu nghi vấn'],a:0,w:'"Không thể không" nhấn mạnh ý khẳng định: chắc chắn nhớ.'},
  {t:'mc',q:'"Làm sao có thể rời mẹ mà đi được?" Câu hỏi này dùng để làm gì?',o:['Phủ định (không thể rời mẹ)','Hỏi thông tin','Ra lệnh','Chào hỏi'],a:0,w:'Câu nghi vấn dùng với mục đích phủ định, thể hiện cảm xúc.'},
  {t:'mc',q:'Câu nào là câu bị động?',o:['Bức tranh được em treo ở phòng khách.','Em treo bức tranh ở phòng khách.','Em được điểm tốt.','Bức tranh rất đẹp.'],a:0,w:'Chủ ngữ "bức tranh" chịu tác động và đổi được thành câu chủ động tương ứng.'}]}]},
{t:'Biện pháp tu từ',s:'16 biện pháp và cách nêu tác dụng',c:'#C93D72',gl:'Tu từ',hb:'tutu',lessons:[
 {card:{h:'So sánh, nhân hóa, ẩn dụ, hoán dụ',p:'Ẩn dụ dựa trên nét tương đồng (4 kiểu: hình thức, cách thức, phẩm chất, chuyển đổi cảm giác). Hoán dụ dựa trên quan hệ gần gũi (4 kiểu: bộ phận – toàn thể, vật chứa – vật bị chứa, dấu hiệu – sự vật, cụ thể – trừu tượng). Nhân hóa có 3 kiểu: gọi vật bằng từ gọi người, tả vật bằng từ tả người, trò chuyện với vật như với người.'},qs:[
  {t:'mc',q:'"Ông mặt trời" là kiểu nhân hóa nào?',o:['Dùng từ vốn gọi người để gọi vật','Dùng từ chỉ hoạt động của người cho vật','Trò chuyện với vật như với người','Không phải nhân hóa'],a:0,w:'"Ông" là từ dùng để gọi người.'},
  {t:'mc',q:'"Nắng giòn tan" — nắng vốn cảm bằng mắt nay cảm như bằng vị giác. Đây là gì?',o:['Ẩn dụ chuyển đổi cảm giác','Hoán dụ','So sánh','Nói quá'],a:0,w:'Chuyển cảm nhận từ giác quan này sang giác quan khác.'},
  {t:'mc',q:'"Áo nâu liền với áo xanh" — "áo nâu" chỉ người nông dân. Đây là biện pháp gì?',o:['Hoán dụ (dấu hiệu – sự vật)','Ẩn dụ phẩm chất','So sánh','Nhân hóa'],a:0,w:'Lấy trang phục đặc trưng để gọi người mặc nó.'},
  {t:'mc',q:'"Cả lớp vỗ tay hoan hô." "Lớp" là hoán dụ kiểu nào?',o:['Vật chứa – vật bị chứa','Bộ phận – toàn thể','Cụ thể – trừu tượng','Dấu hiệu – sự vật'],a:0,w:'"Lớp" (nơi chứa) chỉ học sinh trong lớp.'},
  {t:'mc',q:'Điểm khác cơ bản giữa ẩn dụ và hoán dụ là gì?',o:['Ẩn dụ dựa trên nét tương đồng, hoán dụ dựa trên quan hệ gần gũi','Ẩn dụ luôn có từ "như"','Hoán dụ chỉ dùng trong văn xuôi','Không có khác biệt'],a:0,w:'Hỏi: hai sự vật giống nhau (ẩn dụ) hay đi liền với nhau (hoán dụ)?'}]},
 {deep:1,card:{h:'Đào sâu: điệp, đảo, đối, tăng cấp',p:'Điệp ngữ có 3 kiểu: cách quãng, nối tiếp, chuyển tiếp (vòng). Đảo ngữ đưa vị ngữ hay phụ ngữ lên trước để nhấn mạnh. Đối lập, đối xứng làm nổi bật hoặc tạo cân đối. Tăng cấp đưa chi tiết sau mạnh hơn chi tiết trước. Cách trả lời tác dụng: gọi tên + chỉ rõ → hình thức → nội dung → tình cảm.',code:'Lom khom dưới núi tiều vài chú\n(Bà Huyện Thanh Quan)'},qs:[
  {t:'mc',q:'Câu thơ của Bà Huyện Thanh Quan trong thẻ bí kíp dùng biện pháp gì?',o:['Đảo ngữ','Điệp ngữ','Liệt kê','Chơi chữ'],a:0,w:'Từ láy "lom khom" được đưa lên đầu câu để nhấn mạnh dáng vẻ nhỏ bé, vất vả.'},
  {t:'mc',q:'"Một đèo, một đèo, lại một đèo" (Hồ Xuân Hương) dùng kiểu điệp ngữ nào?',o:['Điệp ngữ nối tiếp','Điệp ngữ cách quãng','Điệp ngữ chuyển tiếp','Không có điệp ngữ'],a:0,w:'Các từ ngữ lặp lại liền nhau, gợi sự trùng điệp của núi đèo.'},
  {t:'mc',q:'"Bên lở thì đục, bên bồi thì trong" (ca dao) dùng biện pháp gì nổi bật?',o:['Đối lập','So sánh','Hoán dụ','Nói giảm'],a:0,w:'Lở – bồi, đục – trong đặt cạnh nhau làm nổi bật cả hai.'},
  {t:'order',q:'Sắp xếp các bước trả lời câu hỏi tác dụng của biện pháp tu từ',lines:['Gọi tên biện pháp và chỉ rõ từ ngữ thể hiện','Nêu tác dụng về hình thức: gợi hình, gợi cảm, tạo nhịp điệu…','Nêu tác dụng về nội dung: nhấn mạnh, làm rõ điều gì','Nêu tác dụng về tình cảm: thái độ, cảm xúc của người viết'],w:'Đi từ nhận diện đến hiệu quả, từ hình thức đến nội dung và tình cảm.'},
  {t:'mc',q:'"Dì khóc nức nở, khóc nấc lên, khóc như người ta thổ" là biện pháp gì?',o:['Tăng cấp (tăng tiến)','Nói giảm','Đảo ngữ','Chơi chữ'],a:0,w:'Mức độ khóc tăng dần, cho thấy nỗi đau dâng lên đến cao trào.'}]}]},
{t:'Văn bản và liên kết',s:'dẫn, hàm ý, dấu câu, liên kết, kiểu đoạn',c:'#D9930B',gl:'Đoạn văn',hb:'vb',lessons:[
 {card:{h:'Dẫn, hàm ý, dấu câu',p:'Dẫn trực tiếp: nguyên văn, sau dấu hai chấm, trong ngoặc kép. Dẫn gián tiếp: thuật lại, không ngoặc kép. Nghĩa tường minh nói thẳng; hàm ý suy ra từ ngữ cảnh. Dấu chấm phẩy ngăn các vế câu ghép phức tạp hoặc bộ phận liệt kê phức tạp.'},qs:[
  {t:'mc',q:'"Nguyễn Du từng viết rằng người buồn thì cảnh chẳng bao giờ vui." Đây là cách dẫn nào?',o:['Dẫn gián tiếp','Dẫn trực tiếp','Không phải lời dẫn','Vừa trực tiếp vừa gián tiếp'],a:0,w:'Không có ngoặc kép, có từ "rằng", lời được thuật lại.'},
  {t:'mc',q:'– Mai đi xem phim với tớ nhé? – Mình bận ôn thi. Câu trả lời mang hàm ý gì?',o:['Từ chối','Đồng ý','Hỏi lại','Khen ngợi'],a:0,w:'Không nói thẳng "không đi", nhưng người nghe hiểu là từ chối.'},
  {t:'mc',q:'Dấu ba chấm KHÔNG có công dụng nào?',o:['Đánh dấu lời dẫn trực tiếp','Thể hiện liệt kê chưa hết','Thể hiện lời nói ngập ngừng','Chuẩn bị cho một ý bất ngờ, hài hước'],a:0,w:'Lời dẫn trực tiếp được đánh dấu bằng ngoặc kép.'},
  {t:'mc',q:'Dấu ngoặc đơn dùng để làm gì?',o:['Đánh dấu phần chú thích','Kết thúc câu hỏi','Đánh dấu lời thoại','Ngăn các vế câu ghép'],a:0,w:'Ví dụ: Nguyễn Du (1765–1820).'},
  {t:'fill',q:'Điền tên dấu câu',code:'Dấu ___ đánh dấu ranh giới giữa các vế của một câu ghép phức tạp.',bank:['chấm phẩy','chấm than','ngoặc đơn','hai chấm'],a:['chấm phẩy'],w:'Chấm phẩy cũng ngăn các bộ phận trong phép liệt kê phức tạp.'}]},
 {deep:1,card:{h:'Đào sâu: liên kết và kiểu đoạn',p:'Liên kết nội dung: các câu cùng hướng về chủ đề, sắp xếp hợp lí. Liên kết hình thức: phép lặp, thế, nối, đồng nghĩa – trái nghĩa – liên tưởng. Bốn kiểu đoạn: diễn dịch, quy nạp, tổng – phân – hợp, song song.'},qs:[
  {t:'mc',q:'"Nguyễn Du là đại thi hào. Tác giả để lại kiệt tác Truyện Kiều." "Tác giả" thể hiện phép liên kết nào?',o:['Phép thế','Phép lặp','Phép nối','Phép liên tưởng'],a:0,w:'"Tác giả" thay cho "Nguyễn Du".'},
  {t:'mc',q:'"Tác phẩm… Nhưng nghệ sĩ…" Cặp "tác phẩm – nghệ sĩ" liên kết bằng phép gì?',o:['Liên tưởng','Thế','Nối','Lặp'],a:0,w:'Hai từ thuộc cùng một trường liên tưởng (nghệ thuật).'},
  {t:'mc',q:'Đoạn văn không có câu chủ đề, các câu ngang hàng cùng làm rõ một nội dung là đoạn gì?',o:['Song song','Diễn dịch','Quy nạp','Tổng – phân – hợp'],a:0,w:'Còn gọi là đoạn song hành.'},
  {t:'mc',q:'Đoạn văn có câu chủ đề ở cả đầu và cuối là đoạn gì?',o:['Tổng – phân – hợp','Diễn dịch','Quy nạp','Song song'],a:0,w:'Nêu khái quát ở đầu, cụ thể ở giữa, khẳng định lại ở cuối.'},
  {t:'mc',q:'Cước chú là gì?',o:['Chú thích ở chân trang hoặc cuối văn bản để giải thích từ khó hoặc ghi nguồn','Câu kết của đoạn văn','Tên tác giả','Lời đề tặng'],a:0,w:'Gặp nhiều trong văn bản thông tin, nghị luận và văn học cổ được in lại.'}]}]},
{t:'Thể thơ',s:'lục bát, các thể thơ chữ, Đường luật, trào phúng',c:'#7C4DDB',gl:'6 – 8',hb:'tho',lessons:[
 {card:{h:'Lục bát và các thể thơ chữ',p:'Lục bát: tiếng cuối dòng 6 vần với tiếng thứ 6 dòng 8; tiếng cuối dòng 8 vần với tiếng cuối dòng 6 tiếp theo. Tiếng 2, 6, 8 thanh bằng, tiếng 4 thanh trắc; trong dòng 8, tiếng 6 và 8 khác dấu (huyền – ngang). Nhịp chẵn.',code:'Mẹ ngồi vá áo bên thềm\nĐường kim nối những ngày êm tháng dài\nCon đi xa vẫn nhớ hoài\nBàn tay mẹ ấm như ngoài nắng xuân'},qs:[
  {t:'mc',q:'Trong khổ thơ ở thẻ bí kíp, tiếng "thềm" vần với tiếng nào?',code:'Mẹ ngồi vá áo bên thềm\nĐường kim nối những ngày êm tháng dài',o:['êm','dài','kim','ngày'],a:0,w:'Tiếng cuối dòng 6 vần với tiếng thứ 6 của dòng 8: thềm – êm.'},
  {t:'mc',q:'Tiếng "dài" (cuối dòng 8) vần với tiếng nào?',code:'Đường kim nối những ngày êm tháng dài\nCon đi xa vẫn nhớ hoài',o:['hoài','xa','con','nhớ'],a:0,w:'Tiếng cuối dòng 8 vần với tiếng cuối dòng 6 tiếp theo: dài – hoài.'},
  {t:'mc',q:'Trong thơ lục bát, tiếng thứ 4 thường mang thanh gì?',o:['Thanh trắc','Thanh bằng','Thanh huyền','Không quy định'],a:0,w:'Luật: 2 bằng – 4 trắc – 6 bằng (– 8 bằng).'},
  {t:'mc',q:'Thơ bảy chữ thường ngắt nhịp thế nào?',o:['4/3','2/2','2/3','3/3'],a:0,w:'Thơ bốn chữ thường 2/2, năm chữ 2/3 hoặc 3/2.'},
  {t:'mc',q:'Nhân vật trữ tình trong khổ thơ ở thẻ bí kíp là ai?',o:['Người con','Người mẹ','Đường kim','Nắng xuân'],a:0,w:'Người con là người trực tiếp bộc lộ nỗi nhớ, tình yêu với mẹ.'}]},
 {deep:1,card:{h:'Đào sâu: Đường luật, trào phúng, tự do',p:'Thất ngôn bát cú: 8 câu, mỗi câu 7 chữ; bố cục đề – thực – luận – kết; hai câu thực và hai câu luận đối nhau; vần bằng ở câu 1, 2, 4, 6, 8; niêm 1–8, 2–3, 4–5, 6–7. Tứ tuyệt: 4 câu; khởi – thừa – chuyển – hợp. Thơ trào phúng dùng tiếng cười phê phán. Thơ tự do không quy định số tiếng, số dòng.'},qs:[
  {t:'order',q:'Sắp xếp bố cục bài thất ngôn bát cú',lines:['Đề','Thực','Luận','Kết'],w:'Mỗi phần gồm hai câu.'},
  {t:'mc',q:'Trong thất ngôn bát cú, những cặp câu nào bắt buộc đối nhau?',o:['Câu 3–4 và câu 5–6','Câu 1–2 và câu 7–8','Câu 1–8','Không cặp nào'],a:0,w:'Hai câu thực và hai câu luận phải đối về âm, về từ loại, về nghĩa.'},
  {t:'mc',q:'Bố cục thường gặp của thơ tứ tuyệt là gì?',o:['Khởi – thừa – chuyển – hợp','Đề – thực – luận – kết','Mở bài – thân bài – kết bài','Thất – thất – lục – bát'],a:0,w:'Bốn câu ứng với bốn bước mở – tiếp – chuyển – kết.'},
  {t:'mc',q:'Thơ trào phúng thường dùng thủ pháp nào?',o:['Chơi chữ, phóng đại, tương phản để gây cười và phê phán','Chỉ dùng từ Hán Việt trang trọng','Không bao giờ dùng khẩu ngữ','Chỉ viết về thiên nhiên'],a:0,w:'Tiếng cười trong thơ trào phúng nhằm phê phán cái xấu.'},
  {t:'bug',q:'Chạm vào phát biểu SAI',lines:['Thơ tự do không quy định số tiếng mỗi dòng','Vần chân là vần gieo ở cuối dòng thơ','Cảm hứng chủ đạo là cảm xúc bao trùm toàn bài','Thất ngôn bát cú gieo vần trắc ở cuối các câu chẵn'],a:3,w:'Thất ngôn bát cú gieo vần bằng ở cuối câu 1, 2, 4, 6, 8.'}]}]},
{t:'Đọc hiểu truyện',s:'nhận biết, thông hiểu, vận dụng',c:'#2B72D6',gl:'Đọc hiểu',hb:'doc',lessons:[
 {card:{h:'Câu hỏi nhận biết',p:'Đọc kĩ ngữ liệu rồi xác định: thể loại, ngôi kể, nhân vật chính, tình huống truyện, đề tài, lời người kể và lời nhân vật. Lời nhân vật thường đứng sau gạch ngang hoặc trong ngoặc kép.',code:'Chiều ấy mưa to. Minh đứng nép dưới mái hiên trường, tay ôm chiếc ô vàng mẹ mới mua. Bên kia đường, bà cụ bán rau co ro che thúng hàng bằng tấm ni lông rách. Minh nhìn chiếc ô, rồi nhìn bà. Cậu chạy sang, dúi chiếc ô vào tay bà: "Bà cầm lấy ạ, nhà cháu gần đây thôi!". Rồi cậu đội cặp chạy vào màn mưa. Về đến nhà, áo ướt sũng, Minh lí nhí kể lại, lòng thấp thỏm sợ mẹ mắng. Mẹ chỉ lặng lẽ lấy khăn lau tóc cho cậu, mắt ánh lên niềm vui.\n(Ngữ liệu luyện tập do app soạn)'},qs:[
  {t:'mc',q:'Ngữ liệu "Chiếc ô vàng" được kể theo ngôi nào?',o:['Ngôi thứ ba','Ngôi thứ nhất','Ngôi thứ hai','Không có người kể'],a:0,w:'Người kể giấu mình, gọi nhân vật bằng tên "Minh".'},
  {t:'mc',q:'Nhân vật chính của câu chuyện là ai?',o:['Minh','Bà cụ bán rau','Người mẹ','Người kể chuyện'],a:0,w:'Minh xuất hiện từ đầu đến cuối và mọi sự việc xoay quanh hành động của cậu.'},
  {t:'mc',q:'Tình huống truyện là gì?',o:['Trời mưa to, Minh có ô mới còn bà cụ bán rau không có gì che','Minh bị mẹ mắng vì làm mất ô','Minh đi học muộn','Bà cụ tặng Minh một bó rau'],a:0,w:'Tình huống buộc Minh phải lựa chọn, từ đó bộc lộ tính cách.'},
  {t:'mc',q:'Câu nào là lời nhân vật?',o:['"Bà cầm lấy ạ, nhà cháu gần đây thôi!"','Chiều ấy mưa to.','Minh nhìn chiếc ô, rồi nhìn bà.','Mẹ chỉ lặng lẽ lấy khăn lau tóc cho cậu.'],a:0,w:'Lời nói trực tiếp của Minh, đặt trong ngoặc kép sau dấu hai chấm.'},
  {t:'mc',q:'Đề tài của câu chuyện là gì?',o:['Lòng tốt, sự sẻ chia trong cuộc sống thường ngày','Chiến tranh','Thiên nhiên hoang dã','Khoa học viễn tưởng'],a:0,w:'Đề tài là phạm vi đời sống được phản ánh.'}]},
 {deep:1,card:{h:'Đào sâu: thông hiểu và vận dụng',p:'Ý nghĩa chi tiết: vị trí → làm rõ nhân vật → thể hiện chủ đề → ấn tượng với người đọc. Tác dụng ngôi thứ ba: khách quan, linh hoạt, bao quát. Câu hỏi bài học: nêu nội dung → bài học nhận thức → bài học hành động.',code:'Chiều ấy mưa to. Minh đứng nép dưới mái hiên trường, tay ôm chiếc ô vàng mẹ mới mua. Bên kia đường, bà cụ bán rau co ro che thúng hàng bằng tấm ni lông rách. Minh nhìn chiếc ô, rồi nhìn bà. Cậu chạy sang, dúi chiếc ô vào tay bà: "Bà cầm lấy ạ, nhà cháu gần đây thôi!". Rồi cậu đội cặp chạy vào màn mưa. Về đến nhà, áo ướt sũng, Minh lí nhí kể lại, lòng thấp thỏm sợ mẹ mắng. Mẹ chỉ lặng lẽ lấy khăn lau tóc cho cậu, mắt ánh lên niềm vui.'},qs:[
  {t:'mc',q:'Chi tiết "Minh nhìn chiếc ô, rồi nhìn bà" cho thấy điều gì?',o:['Minh đắn đo giữa món đồ mình quý và người đang cần giúp, nên việc tốt càng đáng trân trọng','Minh không thích chiếc ô','Minh muốn bán chiếc ô','Minh sợ bà cụ'],a:0,w:'Khoảnh khắc lựa chọn làm hành động cho đi trở nên chân thực và ý nghĩa hơn.'},
  {t:'mc',q:'Chi tiết người mẹ "mắt ánh lên niềm vui" có ý nghĩa gì?',o:['Mẹ tự hào vì con biết sẻ chia; khẳng định lòng tốt đáng được trân trọng','Mẹ vui vì con bị ướt','Mẹ không quan tâm chuyện chiếc ô','Mẹ sắp mắng con'],a:0,w:'Chi tiết kết tạo bất ngờ (Minh sợ bị mắng) và làm rõ chủ đề.'},
  {t:'mc',q:'Ngôi kể thứ ba có tác dụng gì trong ngữ liệu này?',o:['Kể khách quan, quan sát được cả Minh, bà cụ và người mẹ','Giúp nhân vật tự xưng "tôi"','Làm câu chuyện mất tính chân thực','Chỉ kể được suy nghĩ của bà cụ'],a:0,w:'Người kể đứng ngoài nên bao quát nhiều nhân vật, sự việc.'},
  {t:'mc',q:'Chủ đề của câu chuyện là gì?',o:['Ca ngợi lòng tốt, sự sẻ chia hồn nhiên và giá trị của việc nuôi dạy con biết yêu thương','Phê phán thói ích kỉ của bà cụ','Kể về một trận mưa lớn','Nói về việc mua sắm đồ dùng học tập'],a:0,w:'Chủ đề là vấn đề chính, thông điệp tác giả gửi gắm qua câu chuyện.'},
  {t:'order',q:'Sắp xếp các bước trả lời câu hỏi "Bài học em rút ra"',lines:['Nêu ngắn gọn nội dung chính của câu chuyện','Rút ra bài học nhận thức: hiểu được điều gì','Nêu bài học hành động: 2–3 việc cụ thể em sẽ làm','Đánh giá ý nghĩa của bài học với bản thân và cộng đồng'],w:'Đi từ nội dung đến nhận thức, rồi đến hành động cụ thể.'}]}]},
{t:'Viết đoạn văn nghị luận văn học',s:'khung đoạn văn phân tích thơ, truyện',c:'#12895C',gl:'NLVH',hb:'nlvh',lessons:[
 {card:{h:'Khung đoạn văn phân tích',p:'Mở đoạn: giới thiệu tác giả, tác phẩm, nhận xét chung. Thân đoạn: nhân vật trữ tình và cảm xúc chủ đạo → phân tích nội dung theo bố cục (trích dẫn, phân tích biện pháp, chốt ý) → đánh giá nghệ thuật. Kết đoạn: khẳng định chủ đề, cảm nghĩ.'},qs:[
  {t:'order',q:'Sắp xếp các phần của đoạn văn phân tích một đoạn thơ',lines:['Giới thiệu tác giả, tác phẩm, nhận xét khái quát','Giới thiệu nhân vật trữ tình và cảm xúc chủ đạo','Phân tích nội dung theo bố cục, kèm dẫn chứng','Đánh giá đặc sắc nghệ thuật','Khẳng định chủ đề, nêu cảm nghĩ'],w:'Đây là khung chung, có thể linh hoạt nhưng không được thiếu dẫn chứng và nhận xét.'},
  {t:'mc',q:'Lỗi nào thường làm đoạn văn phân tích bị mất điểm nhất?',o:['Kể lại nội dung, không phân tích từ ngữ, hình ảnh','Có câu chủ đề','Trích dẫn thơ trong ngoặc kép','Có câu kết'],a:0,w:'Phân tích là chỉ ra cái hay của từ ngữ, hình ảnh, biện pháp và tác dụng, không phải kể lại.'},
  {t:'mc',q:'Sau khi trích dẫn một hình ảnh thơ, bước tiếp theo nên làm gì?',o:['Phân tích biện pháp nghệ thuật và chốt cảm xúc, ý nghĩa','Chuyển ngay sang khổ khác','Chép thêm cả bài thơ','Kể tiểu sử tác giả'],a:0,w:'Trích dẫn – phân tích – chốt ý là nhịp ba bước của mỗi luận điểm nhỏ.'},
  {t:'mc',q:'Câu mở đoạn nào phù hợp nhất cho đề phân tích khổ thơ "Mẹ ngồi vá áo bên thềm…"?',o:['Khổ thơ lục bát giản dị đã khắc họa hình ảnh người mẹ tảo tần và nỗi nhớ thương sâu nặng của người con.','Ngày xưa em có một chiếc áo.','Thơ lục bát có rất nhiều bài.','Em rất thích thơ.'],a:0,w:'Câu mở đoạn cần nêu được đối tượng và nhận xét khái quát về nội dung.'},
  {t:'bug',q:'Chạm vào câu mắc lỗi diễn đạt',lines:['Hình ảnh "đường kim" gợi sự tảo tần của mẹ.','Qua khổ thơ cho thấy tình yêu của con dành cho mẹ.','Phép so sánh "ấm như ngoài nắng xuân" làm hình ảnh bàn tay mẹ thêm ấm áp.','Khổ thơ để lại nhiều xúc động cho người đọc.'],a:1,w:'"Qua khổ thơ" là trạng ngữ nên câu thiếu chủ ngữ. Sửa: "Khổ thơ cho thấy…".'}]}],
 boss:{q:'Viết đoạn văn (khoảng 150–200 chữ) phân tích khổ thơ lục bát sau:\nMẹ ngồi vá áo bên thềm / Đường kim nối những ngày êm tháng dài / Con đi xa vẫn nhớ hoài / Bàn tay mẹ ấm như ngoài nắng xuân.',crit:'Mở đoạn giới thiệu và nhận xét khái quát; xác định nhân vật trữ tình (người con) và cảm xúc chủ đạo (nhớ thương, biết ơn mẹ); phân tích được ít nhất 2 hình ảnh/biện pháp (hình ảnh mẹ vá áo, "đường kim nối những ngày", phép so sánh "ấm như… nắng xuân", thể lục bát nhịp nhàng); có trích dẫn đúng cách; kết đoạn khẳng định chủ đề; diễn đạt mạch lạc, đúng chính tả.',sol:'Dàn ý gợi ý (em tự viết thành đoạn):\n– Mở đoạn: khổ thơ lục bát giản dị khắc họa người mẹ tảo tần và tình con thương nhớ.\n– Nhân vật trữ tình: người con đi xa; cảm xúc chủ đạo: nhớ thương, biết ơn.\n– Hai câu đầu: hình ảnh mẹ vá áo bên thềm; "đường kim nối những ngày…" gợi thời gian và sự hi sinh lặng lẽ.\n– Hai câu sau: nỗi nhớ "hoài"; phép so sánh bàn tay mẹ với nắng xuân → ấm áp, che chở.\n– Nghệ thuật: thể lục bát, nhịp chẵn êm, hình ảnh đời thường.\n– Kết đoạn: khẳng định tình mẫu tử, liên hệ bản thân.'}},
{t:'Bài văn nghị luận xã hội',s:'3 dạng đề và cách lập dàn ý',c:'#E0592F',gl:'NLXH',hb:'nlxh',lessons:[
 {card:{h:'Dạng nghị luận về một vấn đề',p:'Mở bài nêu vấn đề. Thân bài: giải thích → bàn luận (biểu hiện, nguyên nhân, ích lợi hoặc tác hại với cá nhân – gia đình – xã hội, có dẫn chứng) → phản đề, mở rộng → bài học nhận thức và hành động. Kết bài khẳng định, liên hệ bản thân.'},qs:[
  {t:'order',q:'Sắp xếp các bước của phần thân bài (dạng một vấn đề)',lines:['Giải thích từ ngữ, khái niệm','Nêu biểu hiện của vấn đề','Phân tích nguyên nhân','Phân tích ích lợi hoặc tác hại','Phản đề, mở rộng vấn đề','Rút ra bài học nhận thức và hành động'],w:'Giải thích trước để hiểu đúng vấn đề, sau đó mới bàn luận.'},
  {t:'mc',q:'Khi phân tích ích lợi hay tác hại, nên xét trên những phương diện nào?',o:['Cá nhân, gia đình, xã hội','Chỉ bản thân em','Chỉ nhà trường','Chỉ thế giới'],a:0,w:'Ba tầng giúp lập luận toàn diện, có chiều sâu.'},
  {t:'mc',q:'Phần "phản đề" có nhiệm vụ gì?',o:['Phản bác ý kiến trái chiều, phân biệt với khái niệm dễ nhầm','Nhắc lại mở bài','Kể một câu chuyện cười','Liệt kê tên các nhà văn'],a:0,w:'Phản đề cho thấy người viết nhìn vấn đề nhiều chiều.'},
  {t:'mc',q:'Nguyên nhân "chủ quan" của một hiện tượng là gì?',o:['Nguyên nhân từ chính bản thân mỗi người','Nguyên nhân từ thời tiết','Nguyên nhân từ xã hội, nhà trường','Nguyên nhân không xác định'],a:0,w:'Nguyên nhân khách quan đến từ bên ngoài: gia đình, nhà trường, xã hội.'},
  {t:'bug',q:'Đề bàn về niềm vui tuổi học trò. Chạm vào dẫn chứng KHÔNG phù hợp',lines:['Niềm vui khi cùng bạn bè chuẩn bị một tiết mục văn nghệ cho lớp','Cảm giác hân hoan khi giải được một bài toán khó','Niềm hạnh phúc khi được thầy cô động viên sau giờ học','Giá xăng dầu tăng trong tháng vừa qua'],a:3,w:'Dẫn chứng phải gắn với vấn đề đang bàn.'}]},
 {deep:1,card:{h:'Đào sâu: dạng lựa chọn và dạng giải pháp',p:'Dạng lựa chọn hai ý kiến: giải thích từng ý kiến, chỉ ra mối quan hệ (bổ sung hay đối lập), nêu lựa chọn và chứng minh bằng ích lợi – hậu quả. Dạng giải pháp: giải pháp là trọng tâm; nêu ít nhất 3 giải pháp cho bản thân, gia đình – nhà trường, xã hội; mỗi giải pháp trả lời: vì sao cần, làm thế nào, dẫn chứng, hiệu quả.'},qs:[
  {t:'mc',q:'Trong dạng lựa chọn hai ý kiến, sau khi giải thích từng ý kiến cần làm gì?',o:['Kết luận về mối quan hệ giữa hai ý kiến (bổ sung hay đối lập)','Chọn ngay ý kiến dài hơn','Bỏ qua ý kiến thứ hai','Viết kết bài'],a:0,w:'Hiểu mối quan hệ mới lựa chọn được hợp lí: chọn một, hoặc dung hòa cả hai.'},
  {t:'mc',q:'Trong dạng nghị luận về vấn đề cần giải quyết, phần nào là trọng tâm?',o:['Các giải pháp','Mở bài','Giải thích từ ngữ','Kết bài'],a:0,w:'Cần viết kĩ, chiếm nhiều dung lượng nhất.'},
  {t:'order',q:'Sắp xếp cách trình bày một giải pháp',lines:['Vì sao cần thực hiện giải pháp này','Cách thực hiện cụ thể','Dẫn chứng thực tế','Hiệu quả nếu áp dụng'],w:'Mỗi giải pháp đủ bốn ý thì lập luận mới thuyết phục.'},
  {t:'mc',q:'Giải pháp nào là giải pháp cho "nhà trường" trong đề giảm áp lực học tập?',o:['Tổ chức thêm hoạt động ngoại khóa, câu lạc bộ, tư vấn tâm lí học đường','Em tự lập thời gian biểu hợp lí','Cha mẹ không so sánh con với người khác','Xã hội tổ chức các chiến dịch truyền thông'],a:0,w:'Phân đúng đối tượng giúp hệ thống giải pháp rõ ràng.'},
  {t:'mc',q:'Một đề yêu cầu: "Theo bạn, nên đồng tình với ý kiến nào?" thuộc dạng gì?',o:['Lựa chọn giữa hai ý kiến','Vấn đề cần giải quyết','Phân tích tác phẩm thơ','Thuyết minh'],a:0,w:'Từ khóa "nên đồng tình với ý kiến nào" cho biết đây là dạng lựa chọn.'}]}],

  M('Điệp ngữ "Nhớ nhau, nhớ nhau thương" có tác dụng gì?',['Nhấn mạnh nỗi nhớ, sự lưu luyến khi phải chia xa, tạo nhịp ngân nga','Liệt kê các bạn trong lớp','Làm câu thơ dài hơn','Nêu thời gian chia tay'],'Lặp "nhớ nhau" như một lời thì thầm không dứt.',POEM),

/* 6. Đọc hiểu truyện */
add(5,[
 L('Ngữ liệu 2: ngôi thứ nhất','Với ngôi thứ nhất, người kể xưng "tôi", vừa kể vừa bộc lộ trực tiếp suy nghĩ, cảm xúc.',[
  M('Đoạn trích được kể theo ngôi nào?',['Ngôi thứ nhất','Ngôi thứ ba','Ngôi thứ hai','Không có người kể'],'Người kể xưng "tôi", là người cháu.',P2),
  M('Ngôi kể này có tác dụng gì?',['Câu chuyện chân thực, dễ bộc lộ suy nghĩ, cảm xúc của người cháu','Giúp kể khách quan về mọi nhân vật','Làm câu chuyện mất tự nhiên','Chỉ để kể suy nghĩ của ông'],'Người đọc thấy rõ sự trưởng thành từ bên trong nhân vật "tôi".',P2),

  M('"vụng về như ngày ông dạy tôi cầm bút" dùng biện pháp gì?',['So sánh','Hoán dụ','Nói quá','Liệt kê'],'Gợi lại kỉ niệm, cho thấy vai trò của ông được đổi chiều: giờ cháu chăm sóc cây thay ông.',P2),
  M('Chi tiết "ông xoa đầu tôi, không nói gì" và câu "Tôi hiểu, mình vừa lớn thêm một chút" thể hiện điều gì?',['Tình yêu thương lặng lẽ của ông và sự trưởng thành của cháu khi biết sống có trách nhiệm','Ông giận cháu','Cháu muốn được khen','Chậu cây bị hỏng'],'Đây là chi tiết thể hiện chủ đề của câu chuyện.',P2)]),
 L('Ngữ liệu 3: tình huống và chi tiết','Tình huống truyện đặt nhân vật trước một lựa chọn. Cách nhân vật lựa chọn bộc lộ tính cách và chủ đề.',[
  M('Tình huống truyện là gì?',['Lan làm vỡ bình, giấu đi, khiến em gái bị nghi oan','Mẹ mua bình gốm mới','Lan được điểm cao','Bé Na làm vỡ bình'],'Tình huống buộc Lan phải đối diện với lương tâm.',P3),
  M('"chữ cứ nhảy múa trước mắt" cho thấy điều gì?',['Lan bồn chồn, áy náy, không thể tập trung (nhân hóa)','Lan học rất vui','Sách bị in lỗi','Lan bị đau mắt'],'Biện pháp nhân hóa diễn tả tâm trạng bất an.',P3),
  M('Điều gì khiến Lan đứng dậy nhận lỗi?',['Thương em bị nghi oan và lương tâm cắn rứt','Sợ mẹ phát hiện mảnh vỡ','Muốn được mẹ khen','Mẹ bắt Lan nhận'],'Chi tiết "Nhìn em, Lan đứng dậy" cho thấy nguyên nhân.',P3),
  M('Lời của mẹ cuối truyện thể hiện điều gì?',['Đề cao lòng trung thực hơn giá trị của đồ vật','Mẹ không quý chiếc bình','Mẹ trách Lan','Mẹ sẽ mua bình mới đắt hơn'],'Đây cũng là thông điệp của truyện.',P3),

  M('Các chi tiết "Buổi đầu tiên… Buổi thứ hai… Đến buổi thứ mười" cho thấy điều gì?',['Quá trình kiên trì từng bước vượt qua nỗi sợ của Hùng','Hùng bơi rất giỏi từ đầu','Thầy rất nghiêm khắc','Bể bơi rất sâu'],'Trình tự thời gian tăng tiến làm nổi bật sự bền bỉ.',P4),
  M('Lời thầy "Nước không đáng sợ bằng việc em bỏ cuộc" có ý nghĩa gì?',['Điều đáng sợ nhất không phải khó khăn mà là từ bỏ','Nước rất nguy hiểm','Không nên học bơi','Thầy muốn Hùng nghỉ học'],'Lời thầy là động lực giúp Hùng tiếp tục.',P4),
  M('Chi tiết Hùng "ngoái lại nhìn mép bể… và bật cười" thể hiện điều gì?',['Niềm vui, tự hào vì đã vượt qua chính mình','Hùng chế giễu bạn','Hùng muốn bỏ về','Hùng sợ hãi'],'"Nơi mình từng run rẩy" đối lập với tiếng cười hiện tại.',P4),
  M('Câu trả lời nào tốt nhất cho câu hỏi: "Em có đồng ý với lời thầy không? Vì sao?"',['Đồng ý. Vì nỗi sợ có thể vượt qua bằng luyện tập; bỏ cuộc khiến ta mất cơ hội trưởng thành; kiên trì giúp ta tự tin hơn.','Đồng ý vì thầy nói đúng.','Không đồng ý vì nước rất sâu.','Em thích bơi.'],'Quan điểm rõ + nhiều lí do cụ thể.',P4),
  M('Bài học hành động phù hợp nhất rút ra từ truyện là gì?',['Đặt mục tiêu nhỏ, luyện tập đều đặn mỗi ngày khi học một kĩ năng mới khó với mình','Tránh xa những việc mình sợ','Chờ người khác làm giúp','Chỉ học khi có thầy giục'],'Bài học hành động cần cụ thể, thực hiện được.',P4)]),
 L('Ngữ liệu 5: tổng hợp','Một đề đọc hiểu thường có 5–6 câu đủ ba mức. Làm lần lượt từ dễ đến khó, bám sát ngữ liệu.',[
  M('Đoạn trích được kể theo ngôi nào?',['Ngôi thứ nhất','Ngôi thứ ba','Ngôi thứ hai','Không xác định'],'Người kể xưng "tôi", là cháu của bà.',P5),
  M('Phép liệt kê "mớ rau muống, chục trứng gà, vài bó hành" có tác dụng gì?',['Gợi sự giản dị, ít ỏi của gánh hàng, qua đó thấy sự tần tảo của bà','Cho thấy bà rất giàu','Liệt kê món ăn ngon','Không có tác dụng'],'Gánh hàng nhỏ nhưng nuôi cả gia đình.',P5),
  M('Cụm từ "nuôi cả những ước mơ đầu tiên của tôi" cho thấy điều gì?',['Bà không chỉ nuôi lớn con cháu mà còn nâng đỡ ước mơ của cháu; thể hiện lòng biết ơn','Bà bán ước mơ','Cháu không có ước mơ','Bà muốn cháu đi chợ'],'Cách nói giàu sức gợi, mở rộng ý nghĩa của gánh hàng.',P5),
  M('Hình ảnh "thấy bóng bà lẫn trong sương sớm" ở cuối đoạn gợi điều gì?',['Nỗi nhớ thương, hình bóng bà khắc sâu trong tâm trí người cháu','Bà vẫn ra chợ mỗi ngày','Trời có nhiều sương','Cháu nhìn nhầm người'],'Hình ảnh vừa thực vừa ảo, chứa đựng tình cảm.',P5),
  M('Thông điệp của đoạn trích là gì?',['Biết ơn, trân trọng sự hi sinh thầm lặng của ông bà, cha mẹ','Nên đi chợ sớm','Gánh hàng rất nặng','Chợ quê rất đông'],'Thông điệp rút ra từ cảm xúc và chi tiết của văn bản.',P5)],{k:'Luyện đề'})

/* 7. Đoạn văn NLVH */
add(6,[
 L('Mở đoạn và câu chủ đề','Câu chủ đề phải nêu được đối tượng phân tích và nhận xét khái quát về nội dung (và nghệ thuật nếu có thể). Tránh câu chung chung, lạc đề.',[
  M('Câu chủ đề nào phù hợp nhất cho đề phân tích hai câu đầu bài Tự tình (bài 2)?',['Hai câu thơ mở đầu bài Tự tình (bài 2) đã khắc họa nỗi cô đơn, chua xót của người phụ nữ trong đêm khuya cùng bản lĩnh không chịu khuất phục.','Hồ Xuân Hương là nhà thơ nữ.','Bài thơ có 8 câu.','Em rất thích bài thơ này.'],'Câu chủ đề nêu đối tượng + nội dung khái quát.'),
  M('Mở đoạn cần có những gì?',['Tác giả, tác phẩm, đối tượng phân tích và nhận xét khái quát','Tiểu sử tác giả thật chi tiết','Tóm tắt toàn bộ truyện','Chép lại cả bài thơ'],'Mở đoạn ngắn gọn, đi thẳng vào vấn đề.'),
  B('Đề: phân tích nhân vật Vũ Nương. Chạm vào câu lạc đề',['Nguyễn Dữ đã xây dựng thành công hình tượng Vũ Nương.','Vũ Nương là người phụ nữ đức hạnh mà bất hạnh.','Truyện Kiều là kiệt tác của Nguyễn Du.','Bi kịch của nàng tố cáo xã hội nam quyền bất công.'],2,'Câu này không nói về Vũ Nương.'),
  M('Trong đoạn văn diễn dịch phân tích thơ, câu chủ đề đặt ở đâu?',['Đầu đoạn','Cuối đoạn','Giữa đoạn','Không cần câu chủ đề'],'Đoạn quy nạp mới đặt câu chủ đề ở cuối.'),
  M('Đề "Viết đoạn văn ghi lại cảm nghĩ về bài thơ" khác đề "phân tích" ở điểm nào?',['Nhấn vào cảm xúc, suy nghĩ cá nhân nhưng vẫn cần dẫn chứng từ bài thơ','Không cần dẫn chứng','Chỉ cần kể lại bài thơ','Chỉ cần liệt kê biện pháp tu từ'],'Cảm nghĩ phải xuất phát từ văn bản, không viết lan man.')]),
 L('Phân tích hình ảnh và biện pháp','Mỗi ý phân tích gồm: trích dẫn → chỉ ra nghệ thuật → phân tích tác dụng → chốt ý nghĩa. Tránh lời khen chung chung.',[
  M('Câu phân tích nào tốt nhất cho câu thơ "Trơ cái hồng nhan với nước non" (Hồ Xuân Hương)?',['Từ "trơ" đảo lên đầu câu nhấn mạnh sự trơ trọi, tủi hổ mà cũng đầy thách thức của "hồng nhan" giữa "nước non" rộng lớn.','Câu thơ rất hay.','Câu thơ có 7 chữ.','Nước non là sông núi.'],'Có trích dẫn, chỉ nghệ thuật, phân tích ý nghĩa.'),
  M('Khi phân tích "văng vẳng trống canh dồn", cần làm rõ điều gì?',['Âm thanh từ xa vọng lại, nhịp dồn dập gợi thời gian trôi gấp và tâm trạng rối bời','Màu sắc của đêm','Mùi hương của hoa','Số chữ trong câu'],'Lấy động tả tĩnh, lấy âm thanh gợi tâm trạng.'),
  M('Nghệ thuật nổi bật cần nói đến khi phân tích "Ao thu lạnh lẽo nước trong veo / Một chiếc thuyền câu bé tẻo teo" là gì?',['Vần "eo" gợi không gian thu nhỏ hẹp, tĩnh lặng, se lạnh','Phép nói quá','Câu hỏi tu từ','Liệt kê'],'Âm "eo" khép lại, gợi cảm giác thu nhỏ dần.'),
  O('Sắp xếp các bước của một ý phân tích hoàn chỉnh',['Trích dẫn: "Cỏ non xanh tận chân trời"','Chỉ ra nghệ thuật: gam màu xanh non trải dài tới chân trời','Phân tích: gợi không gian mùa xuân khoáng đạt, tràn đầy sức sống','Chốt ý: thể hiện tâm hồn trẻ trung của con người khi du xuân'],'Trích – chỉ – phân tích – chốt.'),
  M('Câu nào là lời nhận xét chung chung, cần tránh?',['Câu thơ sử dụng nhiều biện pháp nghệ thuật đặc sắc, rất hay và ý nghĩa.','Phép so sánh làm hình ảnh bàn tay mẹ ấm áp như nắng xuân.','Điệp ngữ "Buồn trông" nhấn mạnh nỗi buồn tăng dần.','Từ láy "lom khom" gợi dáng người nhỏ bé, vất vả.'],'Không chỉ rõ biện pháp nào, hay ở đâu.')],{deep:1}),
 W('Phân tích hai câu thơ Tự tình (bài 2)','Gợi ý: thời gian "đêm khuya", âm thanh "văng vẳng trống canh dồn"; từ "trơ" đảo lên đầu câu; "cái hồng nhan" đặt cạnh "nước non". Xem sổ tay mục Đoạn văn nghị luận văn học.','Viết đoạn văn (khoảng 150–200 chữ) phân tích hai câu thơ mở đầu bài Tự tình (bài 2) của Hồ Xuân Hương:\nĐêm khuya văng vẳng trống canh dồn,\nTrơ cái hồng nhan với nước non.','Có câu chủ đề; phân tích thời gian, không gian đêm khuya và âm thanh trống canh dồn dập gợi thời gian trôi và tâm trạng rối bời; phân tích nghệ thuật đảo ngữ với từ "trơ", cụm "cái hồng nhan" đối lập "nước non" để thấy nỗi cô đơn, tủi hổ mà vẫn thách thức; trích dẫn đúng; kết đoạn khái quát; diễn đạt mạch lạc.','Dàn ý gợi ý:\n– Câu chủ đề: hai câu thơ khắc họa nỗi cô đơn, chua xót và bản lĩnh của người phụ nữ.\n– Câu 1: "đêm khuya", "văng vẳng", "dồn" → thời gian, âm thanh, tâm trạng rối bời.\n– Câu 2: đảo ngữ "trơ", "cái hồng nhan" trước "nước non" → trơ trọi, tủi hổ mà thách thức.\n– Nghệ thuật: thất ngôn bát cú chữ Nôm, từ ngữ táo bạo.\n– Kết đoạn: tiếng nói thân phận và khát vọng của người phụ nữ.'),
 L('Đoạn văn phân tích nhân vật truyện','Phân tích nhân vật qua: lời nói, hành động, tâm trạng, quan hệ với nhân vật khác, chi tiết miêu tả; sau đó đánh giá nghệ thuật xây dựng nhân vật.',[
  M('Phân tích nhân vật cần dựa vào những gì?',['Lời nói, hành động, tâm trạng, quan hệ với nhân vật khác, chi tiết miêu tả','Chỉ ngoại hình','Chỉ tên nhân vật','Ý kiến của bạn bè'],'Nhân vật hiện lên toàn diện qua nhiều phương diện.'),
  M('Luận điểm nào phù hợp khi phân tích Vũ Nương?',['Vũ Nương là người con dâu hiếu thảo, tận tình chăm sóc mẹ chồng','Vũ Nương là người ham giàu sang','Vũ Nương là nhân vật phản diện','Vũ Nương là vợ của Phan Lang'],'Bám sát văn bản Chuyện người con gái Nam Xương.'),
  M('Dẫn chứng nào phù hợp cho luận điểm "Vũ Nương thủy chung"?',['Khi chồng đi lính, nàng ở nhà một mình nuôi con, một lòng chờ chồng','Nàng gieo mình xuống sông','Nàng gặp Phan Lang dưới thủy cung','Trương Sinh nghi oan nàng'],'Dẫn chứng phải trực tiếp chứng minh cho luận điểm.'),
  M('Đánh giá nghệ thuật xây dựng nhân vật Vũ Nương nên nêu điều gì?',['Kết hợp hiện thực và kì ảo, khắc họa qua lời nói, hành động, đặt trong tình huống oan khuất','Nhân vật có tên đẹp','Truyện có nhiều nhân vật','Truyện viết rất dài'],'Đánh giá nghệ thuật làm đoạn văn sâu hơn.'),
  O('Sắp xếp bố cục đoạn văn phân tích nhân vật',['Giới thiệu nhân vật và nhận xét chung','Phân tích phẩm chất qua lời nói, hành động','Phân tích số phận, bi kịch của nhân vật','Đánh giá nghệ thuật xây dựng nhân vật','Khẳng định ý nghĩa của nhân vật'],'Từ phẩm chất đến số phận rồi đến đánh giá.')]),
 W('Phân tích nhân vật trong ngữ liệu','Gợi ý: Minh trong "Chiếc ô vàng" (khoá này, chặng Đọc hiểu truyện, bài 1). Chú ý chi tiết "Minh nhìn chiếc ô, rồi nhìn bà", lời nói của Minh, tâm trạng "thấp thỏm sợ mẹ mắng" và phản ứng của người mẹ.','Viết đoạn văn (khoảng 150–200 chữ) phân tích nhân vật Minh trong ngữ liệu "Chiếc ô vàng" (chặng Đọc hiểu truyện).','Có câu chủ đề nêu nét nổi bật của nhân vật; phân tích được ít nhất 2 chi tiết (sự đắn đo khi nhìn chiếc ô và bà cụ; hành động dúi ô và lời nói; tâm trạng thấp thỏm khi về nhà); thấy được lòng tốt hồn nhiên, biết sẻ chia; có nhận xét về cách kể chuyện; kết đoạn nêu ý nghĩa; diễn đạt mạch lạc.','Dàn ý gợi ý:\n– Câu chủ đề: Minh là cậu bé giàu lòng trắc ẩn, biết sẻ chia.\n– Chi tiết đắn đo: món đồ mới quý – người đang cần giúp.\n– Hành động, lời nói: dúi ô, nói dối nhẹ để bà yên tâm nhận.\n– Tâm trạng về nhà: thấp thỏm → hồn nhiên, chân thật.\n– Nghệ thuật: ngôi thứ ba, chi tiết chọn lọc, kết thúc bất ngờ.\n– Kết đoạn: bài học về lòng tốt.'),
 L('Lỗi thường gặp và cách sửa','Lỗi hay gặp: câu thiếu chủ ngữ, kể lại thay vì phân tích, trích thơ sai, lặp từ, thiếu câu kết.',[
  B('Chạm vào câu sai ngữ pháp',['Bằng nghệ thuật ẩn dụ, nhà thơ đã gửi gắm nỗi nhớ quê.','Qua đoạn thơ đã cho ta thấy tình yêu quê hương tha thiết.','Hình ảnh cánh cò gợi vẻ đẹp làng quê yên bình.','Đoạn thơ khép lại bằng một câu hỏi day dứt.'],1,'Câu thiếu chủ ngữ. Sửa: "Đoạn thơ đã cho ta thấy…".'),
  M('Cách trích hai câu thơ nào ĐÚNG?',['"Đêm khuya văng vẳng trống canh dồn / Trơ cái hồng nhan với nước non"','Đêm khuya văng vẳng trống canh dồn, trơ cái hồng nhan với nước non','"Đêm khuya văng vẳng trống canh / Trơ cái hồng nhan"','"đêm khuya văng vẳng trống canh dồn trơ cái hồng nhan với nước non"'],'Đủ ngoặc kép, đúng nguyên văn, ngăn dòng bằng gạch chéo.'),
  M('Câu nào là KỂ LẠI chứ chưa phải phân tích?',['Vũ Nương gieo mình xuống sông Hoàng Giang rồi được Linh Phi cứu.','Hành động gieo mình là lời khẳng định đau đớn về sự trong sạch của Vũ Nương.','Chi tiết cái bóng vừa thắt nút vừa mở nút câu chuyện.','Bi kịch của nàng tố cáo xã hội nam quyền.'],'Câu đầu chỉ thuật lại sự việc, chưa nêu ý nghĩa.'),
  M('Cách sửa lỗi lặp từ tốt nhất: "Bài thơ hay. Bài thơ thể hiện tình yêu. Bài thơ có nhiều biện pháp."',['Bài thơ không chỉ thể hiện tình yêu tha thiết mà còn hấp dẫn nhờ nhiều biện pháp nghệ thuật đặc sắc.','Bài thơ bài thơ bài thơ.','Thơ hay. Thơ yêu. Thơ biện pháp.','Bỏ hết các câu.'],'Gộp ý và dùng phép liên kết hợp lí.'),
  M('Đoạn văn thiếu câu kết sẽ thế nào?',['Thiếu sự khép lại, khái quát ý, đoạn văn bị hẫng','Hay hơn vì ngắn','Không ảnh hưởng gì','Được cộng điểm'],'Câu kết khẳng định lại chủ đề, có thể nêu cảm nghĩ.')],{k:'Luyện đề'}),
 W('Cảm nghĩ về câu ca dao','Gợi ý: đây là đề cảm nghĩ. Nêu ấn tượng chung, phân tích hai hình ảnh so sánh, nói cảm xúc và suy nghĩ của em về công ơn cha mẹ, liên hệ bản thân.','Viết đoạn văn (khoảng 150 chữ) ghi lại cảm nghĩ của em về câu ca dao:\nCông cha như núi Thái Sơn,\nNghĩa mẹ như nước trong nguồn chảy ra.','Đúng kiểu đoạn cảm nghĩ; có câu chủ đề; chỉ ra và cảm nhận hai hình ảnh so sánh (núi Thái Sơn – to lớn, vững chãi; nước trong nguồn – dạt dào, bất tận); bày tỏ cảm xúc chân thành; liên hệ bản thân hợp lí; diễn đạt mạch lạc.','Dàn ý gợi ý:\n– Câu chủ đề: câu ca dao chạm đến lòng biết ơn cha mẹ.\n– Hình ảnh núi Thái Sơn: công cha lớn lao, vững chãi.\n– Hình ảnh nước trong nguồn: tình mẹ dạt dào, không bao giờ cạn.\n– Cảm xúc của em; liên hệ một kỉ niệm.\n– Kết đoạn: việc em sẽ làm để đền đáp.')
]);

/* 8. NLXH: thêm 13 bài */
add(7,[
 L('Đề tương tự: tinh thần tự học','Đề: Suy nghĩ của em về tinh thần tự học của học sinh hiện nay. Dạng nghị luận về một vấn đề (tư tưởng tích cực).',[
  M('Cách giải thích "tự học" đúng nhất là gì?',['Chủ động tìm tòi, tiếp thu kiến thức, rèn kĩ năng mà không ỷ lại vào người khác','Học một mình, không hỏi ai','Học thật nhiều giờ mỗi ngày','Chỉ học trên mạng'],'Tự học là chủ động, không phải cô lập.'),
  B('Chạm vào biểu hiện KHÔNG phải tự học',['Tự lập kế hoạch ôn tập mỗi tối','Tìm thêm tài liệu để hiểu sâu bài học','Chép lời giải trên mạng để nộp bài','Tự đặt câu hỏi khi đọc sách'],2,'Chép lời giải là ỷ lại, ngược với tự học.'),
  M('Ý nghĩa của tự học với cá nhân là gì?',['Hiểu sâu, nhớ lâu, rèn tính chủ động và bản lĩnh','Được thầy cô khen','Không cần đến trường','Có nhiều thời gian chơi'],'Có thể mở rộng: với xã hội là tạo nguồn nhân lực chủ động, sáng tạo.'),
  M('Phản đề phù hợp cho đề này là gì?',['Phê phán lối học thụ động, ỷ lại; phân biệt tự học với học một mình không hỏi ai','Phê phán người đọc sách','Khen người học thêm nhiều','Không cần phản đề'],'Phản đề giúp bài viết nhiều chiều.'),
  M('Bài học hành động nào cụ thể nhất?',['Mỗi ngày dành 30 phút tự ôn bài và ghi lại câu hỏi để hỏi thầy cô','Em sẽ cố gắng hơn','Em sẽ học tốt','Em sẽ tự học'],'Bài học hành động cần việc làm cụ thể, đo được.')]),
 L('Đề tương tự: nghiện điện thoại','Đề: Hiện tượng học sinh nghiện điện thoại thông minh. Dạng nghị luận về một hiện tượng tiêu cực.',[
  M('Câu nào nêu thực trạng thuyết phục nhất?',['Nhiều học sinh dùng điện thoại hàng giờ mỗi ngày, thức khuya lướt mạng xã hội, sao nhãng học tập','Điện thoại rất đẹp','Ai cũng có điện thoại','Điện thoại có nhiều màu'],'Thực trạng cần cụ thể, có biểu hiện rõ.'),
  M('Nguyên nhân chủ quan là gì?',['Học sinh thiếu kĩ năng quản lí thời gian, thiếu tự chủ, tò mò','Nội dung trên mạng quá hấp dẫn','Cha mẹ bận rộn','Giá điện thoại rẻ'],'Ba đáp án còn lại là nguyên nhân khách quan.'),
  M('Nguyên nhân khách quan là gì?',['Các ứng dụng được thiết kế để giữ chân người dùng; cha mẹ ít thời gian bên con','Học sinh lười','Học sinh thiếu tự chủ','Học sinh thích thể hiện'],'Khách quan: từ bên ngoài bản thân.'),
  M('Hậu quả đối với gia đình là gì?',['Ít trò chuyện, khoảng cách giữa cha mẹ và con cái lớn dần','Điểm số giảm','Mắt bị cận','Xã hội mất nguồn nhân lực'],'Phân tích hậu quả theo ba tầng: cá nhân, gia đình, xã hội.'),
  O('Sắp xếp thân bài cho đề này',['Giải thích "nghiện điện thoại"','Nêu thực trạng, biểu hiện','Phân tích nguyên nhân','Phân tích hậu quả','Đề xuất giải pháp, rút ra bài học'],'Hiện tượng tiêu cực: thực trạng → nguyên nhân → hậu quả → giải pháp.')]),
 W('Đồng ý hay không với một ý kiến','Gợi ý: đây là câu hỏi "đồng ý không, vì sao". Nêu rõ quan điểm, giải thích, đưa ít nhất 3 lí do (với bản thân, gia đình, xã hội), có mặt trái (nếu thiếu tình yêu thương thì sao), kết bằng bài học.','Viết đoạn văn (khoảng 200 chữ) trả lời câu hỏi: Có ý kiến cho rằng "Tình yêu thương tạo sức mạnh, giúp con người vượt qua nỗi sợ hãi của bản thân." Em có đồng ý với ý kiến này không? Vì sao?','Nêu rõ quan điểm; giải thích ngắn ý kiến; ít nhất 2–3 lí do có lí lẽ (tình yêu thương tiếp thêm dũng khí, là chỗ dựa tinh thần, giúp con người dám hành động vì người khác); có dẫn chứng hoặc ví dụ; nêu mặt trái khi thiếu yêu thương; bài học nhận thức – hành động; diễn đạt mạch lạc.','Gợi ý khung:\n– Câu chủ đề: nêu quan điểm (đồng ý).\n– Giải thích: tình yêu thương, nỗi sợ hãi.\n– Lí do 1: tình yêu thương là nguồn sức mạnh tinh thần.\n– Lí do 2: vì người mình thương, ta dám vượt qua giới hạn (ví dụ).\n– Lí do 3: được yêu thương giúp ta tự tin, không cô độc.\n– Mặt trái: thiếu yêu thương dễ cô đơn, sợ hãi.\n– Bài học: trao và nhận yêu thương bằng hành động cụ thể.'),
 L('Đề tương tự: học thêm hay trải nghiệm','Đề: Ý kiến 1 cho rằng học sinh nên dành nhiều thời gian học thêm để thi tốt. Ý kiến 2 cho rằng nên dành thời gian cho các trải nghiệm sống. Em chọn ý kiến nào? Dạng lựa chọn.',[
  M('Mối quan hệ giữa hai ý kiến là gì?',['Thoạt nhìn đối lập nhưng thực chất có thể bổ sung cho nhau','Hoàn toàn giống nhau','Không liên quan','Ý kiến 2 là nguyên nhân của ý kiến 1'],'Xác định đúng quan hệ giúp lựa chọn hợp lí.'),
  M('Lựa chọn nào có sức thuyết phục cao nhất?',['Cân bằng: học tập để có nền tảng, trải nghiệm để có kĩ năng sống','Chỉ học thêm, bỏ hết hoạt động khác','Chỉ đi chơi, không cần học','Không chọn gì'],'Dung hòa cần lí giải rõ vì sao và làm thế nào.'),
  M('Hậu quả nếu chỉ chạy theo học thêm là gì?',['Áp lực, mệt mỏi, thiếu kĩ năng sống và trải nghiệm thực tế','Giỏi tất cả mọi thứ','Có nhiều bạn bè hơn','Không có hậu quả'],'Phân tích hậu quả của phía còn lại để củng cố lựa chọn.'),
  M('Mở rộng: khi nào ý kiến 1 cũng hợp lí?',['Giai đoạn ôn thi nước rút, cần tập trung củng cố kiến thức','Kì nghỉ hè dài','Khi đã quá tải','Không bao giờ'],'Mở rộng cho thấy cách nhìn linh hoạt.'),
  M('Câu mở bài nào phù hợp cho dạng đề này?',['Quanh việc học sinh nên dành thời gian cho học thêm hay trải nghiệm, có hai ý kiến khác nhau; theo em, điều quan trọng là biết cân bằng cả hai.','Học thêm rất tốn tiền.','Ngày xưa em đi chơi công viên.','Trải nghiệm là đi du lịch.'],'Nêu được hai ý kiến và quan điểm của mình.')]),
 W('Đề lựa chọn: tài năng hay nỗ lực','Gợi ý: giải thích hai ý kiến → mối quan hệ → nêu lựa chọn → chứng minh bằng ích lợi, hậu quả (cá nhân, gia đình, xã hội), ít nhất 2 dẫn chứng → mở rộng → biện pháp → kết bài.','Lập dàn ý chi tiết (hoặc viết đoạn khoảng 250 chữ) cho đề: Có ý kiến cho rằng thành công chủ yếu đến từ tài năng; ý kiến khác cho rằng thành công đến từ sự nỗ lực. Em đồng tình với ý kiến nào?','Đúng dạng lựa chọn; giải thích hai ý kiến; chỉ ra mối quan hệ; nêu lựa chọn rõ ràng (có thể dung hòa, nhấn mạnh nỗ lực); lập luận bằng ích lợi – hậu quả với dẫn chứng phù hợp; có mở rộng và biện pháp; bố cục 3 phần rõ ràng.','Gợi ý khung:\n– Mở bài: nêu hai ý kiến, quan điểm của em.\n– Giải thích: tài năng, nỗ lực, thành công.\n– Quan hệ: bổ sung, nhưng nỗ lực là yếu tố quyết định.\n– Chứng minh: tài năng không rèn luyện sẽ mai một; nỗ lực giúp phát huy và bù đắp (2 dẫn chứng).\n– Mở rộng: tài năng thiên bẩm là lợi thế cần trân trọng.\n– Biện pháp: kế hoạch rèn luyện của bản thân.\n– Kết bài: khẳng định, liên hệ.'),
 L('Đề tương tự: bạo lực học đường','Đề: Làm thế nào để đẩy lùi bạo lực học đường? Dạng nghị luận về vấn đề cần giải quyết.',[
  M('Giải thích "bạo lực học đường" đúng nhất là gì?',['Hành vi gây tổn hại thể chất, tinh thần giữa học sinh trong môi trường học đường: đánh nhau, lăng mạ, cô lập, bắt nạt qua mạng','Chỉ là đánh nhau ngoài trường','Tranh luận trong giờ học','Thi đua giữa các lớp'],'Bạo lực không chỉ là thể chất, còn có tinh thần và trên mạng.'),
  M('Giải pháp cho bản thân học sinh là gì?',['Kiềm chế, ứng xử văn minh, báo người lớn khi bị hoặc thấy bắt nạt','Tự trả đũa','Im lặng chịu đựng','Quay video đăng lên mạng'],'Giải pháp phải đúng đắn, an toàn, khả thi.'),
  M('Giải pháp cho nhà trường là gì?',['Có phòng tư vấn tâm lí, kênh báo cáo an toàn, nội quy rõ ràng','Đóng cửa trường','Cấm học sinh nói chuyện','Bỏ giờ ra chơi'],'Hệ thống giải pháp chia theo đối tượng.'),
  M('Giải pháp cho gia đình là gì?',['Quan tâm, lắng nghe, dạy con cách ứng xử và kiểm soát cảm xúc','Cho con thật nhiều tiền','Không hỏi chuyện ở trường','Đổi trường liên tục'],'Gia đình là nền tảng giáo dục đầu tiên.'),
  B('Chạm vào giải pháp KHÔNG khả thi, không phù hợp',['Đuổi học tất cả học sinh từng xô xát','Tổ chức chuyên đề kĩ năng giải quyết mâu thuẫn','Đặt hòm thư góp ý ẩn danh','Phụ huynh dành thời gian trò chuyện với con'],0,'Biện pháp cực đoan, không giáo dục, không giải quyết gốc rễ.')]),

 {t:'Bài 4 + Bài 5: Công và công suất – Khúc xạ ánh sáng',qa:[
  ['Công cơ học (công) là gì? Viết công thức tính công A của lực F không đổi làm vật dịch chuyển quãng đường s theo hướng của lực.','Công cơ học (gọi tắt là công) là số đo phần năng lượng được truyền từ vật này sang vật khác khi lực tác dụng làm vật dịch chuyển.\nCông thức: A = F.s\n• A: công (J)\n• F: lực tác dụng (N)\n• s: quãng đường dịch chuyển theo hướng của lực (m)\n1 J = 1 N.m; 1 kJ = 1000 J; 1 MJ = 10⁶ J.'],
  ['Công suất là gì? Viết công thức tính công suất.','Công suất là đại lượng đặc trưng cho tốc độ thực hiện công, có giá trị bằng công thực hiện được trong một đơn vị thời gian.\nCông thức: P = A/t\n• P: công suất (W)\n• A: công thực hiện (J)\n• t: thời gian thực hiện công (s)\n1 W = 1 J/s; 1 kW = 1000 W; 1 MW = 10⁶ W; 1 HP ≈ 746 W.'],
  ['Hiện tượng khúc xạ ánh sáng là gì? Trình bày định luật khúc xạ ánh sáng.','Khúc xạ ánh sáng là hiện tượng tia sáng bị gãy khúc (lệch khỏi phương truyền ban đầu) tại mặt phân cách khi truyền xiên góc từ môi trường trong suốt này sang môi trường trong suốt khác.\nĐịnh luật khúc xạ:\n• Tia khúc xạ nằm trong mặt phẳng tới và ở bên kia pháp tuyến so với tia tới.\n• Với hai môi trường trong suốt nhất định, tỉ số sin i / sin r luôn không đổi: sin i / sin r = hằng số = n21.'],
  ['Nêu khái niệm chiết suất tỉ đối, chiết suất tuyệt đối của môi trường.','Chiết suất tỉ đối n21 của môi trường 2 (chứa tia khúc xạ) đối với môi trường 1 (chứa tia tới) là tỉ số không đổi: n21 = sin i / sin r = n2 / n1.\n• n21 > 1 → r < i: tia khúc xạ lệch lại gần pháp tuyến.\n• n21 < 1 → r > i: tia khúc xạ lệch xa pháp tuyến.\nChiết suất tuyệt đối (chiết suất) của một môi trường là chiết suất tỉ đối của môi trường đó đối với chân không: n = c/v, với c = 3.10⁸ m/s là tốc độ ánh sáng trong chân không, v là tốc độ ánh sáng trong môi trường. Chân không n = 1; không khí n ≈ 1.']]},

  ['Trình bày ý nghĩa của dãy hoạt động hoá học.','• Từ trái sang phải, mức độ hoạt động hoá học của kim loại giảm dần.\n• Kim loại hoạt động mạnh như K, Na, Ca… tác dụng với nước ở điều kiện thường, tạo base và giải phóng khí hydrogen.\n• Kim loại đứng trước H tác dụng với dung dịch acid (HCl, H2SO4 loãng…) giải phóng khí hydrogen.\n• Kim loại đứng trước (trừ K, Na, Ca…) đẩy được kim loại đứng sau ra khỏi dung dịch muối.']]},
 {t:'Bài 37: Các quy luật di truyền của Mendel',qa:[
  ['Phát biểu nội dung quy luật phân li. Mô tả thí nghiệm lai một cặp tính trạng của Mendel và giải thích kết quả.','Quy luật phân li: Mỗi tính trạng do một cặp nhân tố di truyền (cặp allele) quy định. Khi giảm phân hình thành giao tử, các allele trong cặp phân li đồng đều về các giao tử, nên mỗi giao tử chỉ chứa một allele của cặp.\nThí nghiệm: Mendel lai hai giống đậu hà lan thuần chủng khác nhau về một tính trạng, ví dụ hoa tím × hoa trắng → F1 100% hoa tím. Cho F1 tự thụ phấn → F2 có khoảng 3 hoa tím : 1 hoa trắng.\nGiải thích (A: tím trội; a: trắng):\nP: AA × aa → giao tử A và a → F1: Aa (tím)\nF1 × F1: Aa × Aa → mỗi bên cho 2 loại giao tử A, a tỉ lệ bằng nhau → F2: 1 AA : 2 Aa : 1 aa → 3 tím : 1 trắng.'],
  ['Trình bày cách tiến hành phép lai phân tích. Nêu vai trò của phép lai phân tích.','Lai phân tích: lai cơ thể mang tính trạng trội cần kiểm tra kiểu gene với cơ thể mang tính trạng lặn (aa).\n• Nếu đời con đồng tính (100% trội) → cơ thể cần kiểm tra có kiểu gene đồng hợp (AA).\n• Nếu đời con phân tính 1 trội : 1 lặn → cơ thể cần kiểm tra có kiểu gene dị hợp (Aa).\nVai trò: xác định kiểu gene của cơ thể mang tính trạng trội, từ đó kiểm tra độ thuần chủng của giống.']]}

  [DC[2].qa[0][0],DC[2].qa[0][1],'Đề cương câu 1'],[DC[2].qa[1][0],DC[2].qa[1][1],'Đề cương câu 2'],
  ['Tính trạng trội là gì? Tính trạng lặn là gì?','Tính trạng trội: biểu hiện ở kiểu gene đồng hợp trội (AA) hoặc dị hợp (Aa), xuất hiện ở F1 khi P thuần chủng tương phản.\nTính trạng lặn: chỉ biểu hiện ở kiểu gene đồng hợp lặn (aa).'],
  ['Thế nào là đồng hợp, dị hợp?','Đồng hợp: hai allele của cặp giống nhau (AA, aa). Dị hợp: hai allele khác nhau (Aa).'],
  ['Kết quả các phép lai một cặp tính trạng (trội hoàn toàn)','AA × AA → 100% AA\nAA × aa → 100% Aa (100% trội)\nAA × Aa → 1 AA : 1 Aa (100% trội)\nAa × Aa → 1 AA : 2 Aa : 1 aa (3 trội : 1 lặn)\nAa × aa → 1 Aa : 1 aa (1 trội : 1 lặn)\naa × aa → 100% aa'],
  ['Quy luật phân li độc lập','Các cặp allele quy định các tính trạng khác nhau phân li độc lập với nhau trong quá trình hình thành giao tử. F1 AaBb tạo 4 loại giao tử bằng nhau (AB, Ab, aB, ab); F2 có 16 tổ hợp, tỉ lệ kiểu hình 9 : 3 : 3 : 1.'],
  ['F1 đồng tính, F2 phân tính nghĩa là gì?','Đồng tính: con lai đồng nhất một loại kiểu hình. Phân tính: con lai xuất hiện cả tính trạng trội và lặn.']]),
 L('Trắc nghiệm nhiều lựa chọn','Viết sơ đồ lai ra nháp: P → giao tử → đời con. Đếm tổ hợp trên 4.',[
  M('Tính trạng lặn là tính trạng',['chỉ biểu hiện khi kiểu gene ở dạng đồng hợp lặn','luôn biểu hiện ở F1','biểu hiện ở cả thể đồng hợp và dị hợp','không bao giờ biểu hiện'],'Tính trạng lặn biểu hiện ở aa.'),
  M('Phép lai nào sau đây là phép lai phân tích?',['BB × bb','Bb × Bb','BB × Bb','bb × bb'],'Lai cơ thể mang tính trạng trội với cơ thể mang tính trạng lặn (bb).'),
  M('Ở đậu hà lan, thân cao (B) trội hoàn toàn so với thân thấp (b). P: thân cao thuần chủng × thân thấp. Kết quả F2 là',['3 thân cao : 1 thân thấp','1 thân cao : 1 thân thấp','100% thân cao','100% thân thấp'],'P: BB × bb → F1: Bb → F2: 1 BB : 2 Bb : 1 bb.'),
  M('Theo Mendel, khi giảm phân hình thành giao tử, mỗi giao tử chứa',['một allele của cặp','cả hai allele của cặp','không chứa allele nào','hai cặp allele'],'Các allele trong cặp phân li đồng đều về các giao tử.'),
  M('Lai phân tích cây hoa tím thu được 50% hoa tím : 50% hoa trắng. Cây hoa tím đem lai có kiểu gene',['Aa','AA','aa','AA hoặc Aa'],'Phân tính 1 : 1 → cơ thể kiểm tra dị hợp.'),
  M('Cơ thể có kiểu gene AaBb (các gene phân li độc lập) tạo ra bao nhiêu loại giao tử?',['4','2','1','8'],'AB, Ab, aB, ab.'),

(()=>{
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pk=a=>a[Math.floor(Math.random()*a.length)];
const sh=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const nf=(x,d=2)=>String(+(+x).toFixed(d)).replace('.',',');
const nv=(x,d=2)=>{ const c=nf(x,d); return [c,c.replace(',','.')]; };
const mc=(q,correct,cands,w,code)=>{ const o=[String(correct)]; for(const c of cands){ const s=String(c); if(!o.includes(s)) o.push(s); if(o.length===4) break; } let k=1; while(o.length<4){ o.push(String(correct).replace(/\d+/,m=>String(+m+k))); k++; } return {t:'mc',q,o,a:0,w,...(code?{code}:{})}; };
const ty=(q,a,w,code)=>({t:'type',q,a,w,...(code?{code}:{})});
const match=(q,pairs,w)=>({t:'match',q,pairs,w});
const grp=(q,cats,items,w)=>({t:'grp',q,cats,items:items.map(([s,c])=>({s,c})),w});
const SER=['K','Na','Ca','Mg','Al','Zn','Fe','Pb','Cu','Ag','Au'];
const PHYS=[['Công','A = F.s'],['Công suất','P = A/t'],['Chiết suất tuyệt đối','n = c/v'],['Chiết suất tỉ đối','n21 = n2/n1'],['Định luật khúc xạ','sin i / sin r = hằng số'],['Đơn vị của công','J (jun)'],['Đơn vị của công suất','W (oát)'],['1 HP','khoảng 746 W'],['1 kJ','1000 J'],['Tốc độ ánh sáng trong chân không','3.10⁸ m/s'],['Góc hợp bởi tia khúc xạ và mặt phân cách','90° − r'],['Chiết suất của chân không','bằng 1']];
const CHEMP=[['Na cho vào nước','Chạy trên mặt nước, tan dần, có khí thoát ra'],['Đinh Fe vào dung dịch CuSO4','Chất rắn đỏ bám vào, màu xanh nhạt dần'],['Dây Cu vào dung dịch AgNO3','Chất rắn trắng bạc bám vào, dung dịch hoá xanh'],['Viên Zn vào dung dịch HCl','Kẽm tan dần, sủi bọt khí'],['Dây Cu vào dung dịch HCl','Không có hiện tượng gì'],['Ca cho vào nước','Tan, có khí thoát ra, dung dịch hơi đục']];
const BIOP=[['AA × aa','100% Aa'],['Aa × Aa','1 AA : 2 Aa : 1 aa'],['Aa × aa','1 Aa : 1 aa'],['AA × Aa','1 AA : 1 Aa'],['aa × aa','100% aa'],['AA × AA','100% AA']];
const BIOC=[['Đồng hợp','Hai allele giống nhau (AA, aa)'],['Dị hợp','Hai allele khác nhau (Aa)'],['Lai phân tích','Cơ thể trội × cơ thể lặn'],['Tính trạng trội','Biểu hiện ở cả AA và Aa'],['Tính trạng lặn','Chỉ biểu hiện ở aa'],['F1 AaBb','Tạo 4 loại giao tử']];
const LIGHT=[['Ống hút trong cốc nước trông như bị gãy',0],['Đáy bể bơi trông nông hơn thực tế',0],['Nhìn con cá dưới hồ thấy gần mặt nước hơn thực tế',0],['Rót nước vào cốc thì nhìn thấy đồng xu ở đáy',0],['Soi mặt trong gương phẳng',1],['Bóng cây in trên mặt đất lúc trưa nắng',1],['Ảnh ngọn núi in trên mặt hồ phẳng lặng',1],['Tia laser chiếu thẳng trong không khí',1]];
Object.assign(GEN,{
 hk_match_phys(){ return match('Ghép mỗi khái niệm với công thức hoặc giá trị đúng',sh(PHYS).slice(0,4),'Ôn lại bảng công thức trong đề cương.'); },
 hk_match_chem(){ return match('Ghép thí nghiệm với hiện tượng quan sát được',sh(CHEMP).slice(0,4),'Kim loại đứng trước đẩy kim loại đứng sau; K, Na, Ca tác dụng với nước; kim loại sau H không tác dụng với HCl.'); },
 hk_match_bio(){ return match(Math.random()<.5?'Ghép phép lai với tỉ lệ kiểu gene ở đời con':'Ghép khái niệm với ý nghĩa đúng',Math.random()<.5?sh(BIOP).slice(0,4):sh(BIOC).slice(0,4),'Viết sơ đồ lai: giao tử mỗi bên rồi tổ hợp.'); },
 hk_grp_metal(){ const ms=sh(['K','Na','Ca','Mg','Al','Zn','Fe','Cu','Ag','Au']).slice(0,5); return grp('Xếp mỗi kim loại vào nhóm phù hợp (ở điều kiện thường)',['Tác dụng với nước','Không tác dụng với nước nhưng tác dụng với HCl','Không tác dụng với HCl'],ms.map(m=>[m,['K','Na','Ca'].includes(m)?0:['Cu','Ag','Au'].includes(m)?2:1]),'K, Na, Ca tác dụng với nước; Mg, Al, Zn, Fe đứng trước H; Cu, Ag, Au đứng sau H.'); },
 hk_grp_gene(){ const L=pk(['A','B','D','R']), l=L.toLowerCase(); const pool=sh([...new Set([L+L,L+l,l+l,'Aa','bb','DD','Rr','dd'])]).slice(0,5); return grp('Phân loại các kiểu gene',['Đồng hợp trội','Dị hợp','Đồng hợp lặn'],pool.map(g=>[g,g[0]!==g[1]?1:g[0]===g[0].toUpperCase()?0:2]),'Đồng hợp: hai allele giống nhau; dị hợp: hai allele khác nhau.'); },
 hk_grp_light(){ return grp('Hiện tượng nào do khúc xạ ánh sáng gây ra?',['Do khúc xạ','Không phải khúc xạ'],sh(LIGHT).slice(0,5),'Khúc xạ xảy ra khi ánh sáng đi qua mặt phân cách giữa hai môi trường trong suốt (nước – không khí). Gương phẳng, mặt hồ phẳng lặng là phản xạ; bóng cây là do ánh sáng truyền thẳng.'); },
 hk_order_series(){ const ms=sh(SER).slice(0,5).sort((a,b)=>SER.indexOf(a)-SER.indexOf(b)); return {t:'order',q:'Sắp xếp các kim loại theo chiều hoạt động hoá học giảm dần',lines:ms,w:'Dãy: K, Na, Ca, Mg, Al, Zn, Fe, Pb, (H), Cu, Ag, Au.'}; },
 hk_cong_full(){ const F=ri(5,40)*10, s=pk([2,3,4,5,6,8,10,12]), t=pk([4,5,8,10,12,15,20,24,30]); const A=F*s; return ty(`Một người kéo đều vật bằng lực ${F} N đi được ${s} m theo hướng của lực trong ${t} s. Tính công suất của người đó (W, làm tròn 2 chữ số thập phân nếu cần).`,nv(A/t),`Bước 1: A = F.s = ${F} . ${s} = ${A} J. Bước 2: P = A/t = ${A} : ${t} = ${nf(A/t)} W.`); },
 hk_weight(){ const m=pk([20,25,40,50,60,80,100,150,200,500]), h=pk([2,3,4,5,6,8,10,12]); return ty(`Một cần cẩu nâng đều vật có khối lượng ${m} kg lên cao ${h} m. Tính công của lực nâng (J). (Trọng lượng = 10.m)`,nv(10*m*h),`Trọng lượng = 10 . ${m} = ${10*m} N. A = ${10*m} . ${h} = ${10*m*h} J.`); },
 hk_kx_reverse(){ const i=pk([30,40,45,50,60]), n=pk([1.33,1.5,1.41,1.73]); const r=+(Math.asin(Math.sin(i*Math.PI/180)/n)*180/Math.PI).toFixed(2); const nn=Math.sin(i*Math.PI/180)/Math.sin(r*Math.PI/180);
   return mc(`Tia sáng truyền từ không khí vào một môi trường với góc tới ${i}°, góc khúc xạ đo được là ${nf(r)}°. Chiết suất của môi trường xấp xỉ bằng`,nf(nn),[nf(1/nn),nf(nn+0.2),nf(i/r),nf(nn-0.15)],`n = sin i / sin r = sin ${i}° / sin ${nf(r)}° ≈ ${nf(nn)}.`); },
 hk_mix_cu(){ const [X,M]=pk([['Zn',65],['Fe',56],['Mg',24]]); const n=pk([0.05,0.1,0.15,0.2]), mCu=pk([1.6,3.2,4.8,6.4]), mX=M*n, tot=mX+mCu;
   const stem=`Cho ${nf(tot)} g hỗn hợp ${X} và Cu vào dung dịch HCl dư, thu được ${nf(n*24.79,4)} lít khí H2 (đkc). (${X} = ${M})`;
   if(Math.random()<.5) return ty(stem+` Tính khối lượng ${X} trong hỗn hợp (g).`,nv(mX),`Cu không phản ứng với HCl. n(${X}) = n(H2) = ${nf(n*24.79,4)} : 24,79 = ${nf(n)} mol → m(${X}) = ${nf(mX)} g.`);
   return ty(stem+' Tính phần trăm khối lượng Cu trong hỗn hợp (lấy 1 chữ số thập phân).',nv(100*mCu/tot,1),`n(${X}) = ${nf(n)} mol → m(${X}) = ${nf(mX)} g → m(Cu) = ${nf(mCu)} g → %Cu ≈ ${nf(100*mCu/tot,1)}%.`); },
 hk_men_back(){ const t=pk([{L:'A',d:'hoa tím',r:'hoa trắng'},{L:'B',d:'thân cao',r:'thân thấp'},{L:'D',d:'hạt vàng',r:'hạt xanh'}]); const L=t.L, l=L.toLowerCase();
   const cases=[[`3 ${t.d} : 1 ${t.r}`,`${L+l} × ${L+l}`],[`1 ${t.d} : 1 ${t.r}`,`${L+l} × ${l+l}`],[`100% ${t.d}, trong đó một cây P là ${t.r}`,`${L+L} × ${l+l}`],[`100% ${t.r}`,`${l+l} × ${l+l}`]];
   const [res,ans]=pk(cases); return mc(`${L}: ${t.d} trội hoàn toàn so với ${l}: ${t.r}. Đời con thu được ${res}. Kiểu gene của P là`,ans,cases.map(c=>c[1]),`Đối chiếu: 3 : 1 → ${L+l} × ${L+l}; 1 : 1 → ${L+l} × ${l+l} (lai phân tích cơ thể dị hợp); 100% trội khi lai với cây lặn → ${L+L} × ${l+l}.`); }
});

function startFlash(){
  const pool=[]; Object.keys(S.done).filter(k=>inCourse(k)).forEach(k=>{ const [u,l]=k.slice(C.pfx.length).split('-').map(Number); (C.units[u]?.lessons[l]?.qs||[]).forEach(q=>{ if(q.t==='mc') pool.push(q); }); });
  if(pool.length<6){ toast('Học thêm vài bài để mở Tia chớp nhé','bolt'); return; }
  screen='flash'; FL={pool:shuffle(pool),i:0,score:0,combo:0,end:Date.now()+60000,lock:false};
  app.innerHTML=`<div class="screen flash"><div class="ltop"><button class="x" id="fquit" aria-label="Thoát">${I.close(26)}</button><div class="bar fbar"><i id="ftime" style="width:100%"></i></div><span class="fscore" id="fscore">0</span></div><div class="lbody" id="fbody"></div><div class="fcombo" id="fcombo"></div></div>`;
  $('fquit').onclick=()=>{ FL=null; home('learn'); };
  flashQ(); const tick=()=>{ if(!FL) return; const left=FL.end-Date.now(); $('ftime').style.width=Math.max(0,left/600)+'%'; $('ftime').classList.toggle('low',left<10000); if(left<=0) return flashEnd(); requestAnimationFrame(tick); }; requestAnimationFrame(tick);
}
function flashQ(){
  if(!FL) return; if(FL.i>=FL.pool.length){ FL.pool=shuffle(FL.pool); FL.i=0; }
  const q=FL.pool[FL.i++]; FL.q=q; FL.lock=false; const ord=shuffle(q.o.map((_,i)=>i));
  $('fbody').innerHTML=`<div class="qwrap fq"><h2 class="qh">${tx(q.q)}</h2>${codeBlock(q.code)}<div class="opts">${ord.map(i=>`<button class="opt${q.code&&!C.plain?' mono':''}" data-i="${i}">${tx(q.o[i])}</button>`).join('')}</div></div>`;
  $('fbody').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(FL.lock) return; FL.lock=true; const i=+b.dataset.i, ok=i===q.a;
    if(ok){ FL.combo++; FL.score+= FL.combo>=5?2:1; b.classList.add('right'); tone('tap'); }
    else { FL.combo=0; FL.end-=3000; b.classList.add('wrong'); $('fbody').querySelector(`.opt[data-i="${q.a}"]`).classList.add('right'); tone('bad'); buzz(30); }
    $('fscore').textContent=FL.score; $('fcombo').innerHTML= FL.combo>=3?`${I.flame(22)} Combo ${FL.combo}${FL.combo>=5?' · x2 điểm':''}`:'';
    setTimeout(flashQ, ok?220:900); });
}
function flashEnd(){
  if(!FL) return; const sc=FL.score; FL=null; const best=S.flash[C.id]||0, rec=sc>best; if(rec) S.flash[C.id]=sc; save();
  if(sc>0) addCoins(sc); bump('flash'); tone('done'); if(rec&&sc>0) confetti();
  app.innerHTML=`<div class="screen"><div class="rbody">${mascot(sc>=10?'joy':'happy')}<h1>${rec&&sc>0?'Kỷ lục mới!':'Hết giờ!'}</h1><p>Tia chớp 60 giây · ${esc(C.n)}</p>
    <div class="stats"><div class="stat" style="--sc:#D39A0E"><span>Điểm</span><b>${sc}</b></div><div class="stat" style="--sc:#7C4DDB"><span>Kỷ lục</span><b>${Math.max(sc,best)}</b></div><div class="stat" style="--sc:#12955F"><span>Vàng</span><b>+${sc}</b></div></div></div>
    <div class="foot frow"><button class="btn ghost" id="fhome">Về bản đồ</button><button class="btn" id="fagain">Chơi lại</button></div></div>`;
  $('fhome').onclick=()=>home('learn'); $('fagain').onclick=startFlash;
}

function startLesson(u,l){
  const les=C.units[u].lessons[l];
  const queue=buildQueue(u,l);
  L={kind:'lesson',u,l,deep:!!les.deep,card:les.card,queue,total:queue.length,done:0,first:0,tried:new Set(),combo:0,maxCombo:0,t0:Date.now()};

const LENS=[8,12,16];
function buildQueue(u,l){
  const les=C.units[u].lessons[l], target=Math.max(LENS[S.len??1],les.min||0);
  const base=les.qs.map((q,i)=>({id:`${C.pfx}${u}-${l}-${i}`,q})), extra=[];
  if(les.fixed) return base;
  (les.gen||[]).forEach(([nm,n])=>{ for(let k=0;k<n;k++){ if(base.length+extra.length>=target) break; const q=GEN[nm]&&GEN[nm](); if(q) extra.push({id:`${C.pfx}g-${nm}~${k}`,q,tag:'Biến thể'}); } });
  const pool=[]; Object.keys(S.done).filter(k=>inCourse(k)&&k!==C.pfx+u+'-'+l).forEach(k=>{ const [uu,ll]=k.slice(C.pfx.length).split('-').map(Number); (C.units[uu]?.lessons[ll]?.qs||[]).forEach((q,i)=>pool.push({id:`${C.pfx}${uu}-${ll}-${i}`,q,tag:'Ôn xen kẽ'})); });
  shuffle(pool).slice(0,Math.max(0,target-base.length-extra.length)).forEach(x=>extra.push(x));
  return base.concat(shuffle(extra));
}
function startReview(){

}

function atoms(f){ const st=[{}]; let i=0; while(i<f.length){ const ch=f[i];
  if(ch==='('){ st.push({}); i++; }
  else if(ch===')'){ i++; let m=''; while(/\d/.test(f[i]||'')) m+=f[i++]; const g=st.pop(), t=st[st.length-1]; for(const k in g) t[k]=(t[k]||0)+g[k]*(+m||1); }
  else if(/[A-Z]/.test(ch)){ let el=ch; i++; while(/[a-z]/.test(f[i]||'')) el+=f[i++]; let m=''; while(/\d/.test(f[i]||'')) m+=f[i++]; const t=st[st.length-1]; t[el]=(t[el]||0)+(+m||1); }
  else i++; } return st[0]; }

function balCount(q,c){ const L={},Rr={},order=[]; const add=(o,f,k)=>{ const at=atoms(f); for(const e in at){ if(!order.includes(e)) order.push(e); o[e]=(o[e]||0)+at[e]*k; } };

async function tSend(text){
  text=String(text||'').trim(); if(!text||!TU||TU.busy) return;
  const me=TU, msgs=me.ch.msgs;
  if(me.kind==='q'&&!me.locked) Q.asked=true;
  const um={role:'user',text}, bot={role:'assistant',text:'',pending:true};
  msgs.push(um,bot);
  const inp=$('tinput'); inp.value=''; inp.style.height='auto';
  me.busy=true; me.ctl=new AbortController(); drawChat();
  let turns=[], first=true;
  for(const m of msgs){ if(m===bot) break; if(m.failed||m.role==='note') continue;
    if(m.role==='user'){ turns.push({role:'user',content: first ? tutorCtx()+'\n\n---\nTin nhắn đầu tiên của em: '+m.text : m.text}); first=false; }
    else turns.push({role:'assistant',content:m.text}); }
  if(turns.length>11) turns=[turns[0],...turns.slice(-10)];
  const paint=()=>{ if(TU!==me) return; const box=$('tmsgs'); const el=box&&box.lastElementChild; if(el){ el.innerHTML=mdx(bot.text); box.scrollTop=box.scrollHeight; } };
  try{
    await sample(turns,{modelTier:'quick',cache:false,signal:me.ctl.signal,onText:({text})=>{ bot.text=text; bot.pending=false; paint(); }});
    if(!bot.text){ bot.text='Mình chưa nghĩ ra câu trả lời, em hỏi lại theo cách khác nhé.'; bot.err=true; um.failed=bot.failed=true; }
  }catch(e){
    if(e&&e.text){ bot.text=e.text; }
    else { bot.text= e&&e.code==='cancelled' ? 'Đã dừng.' : aiErr(e)||'Có lỗi, thử lại nhé.'; bot.err=true; um.failed=bot.failed=true; }
  }finally{ bot.pending=false; me.busy=false; if(TU===me) drawChat(); }
}

const fold=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
function openHB(openId){
  document.querySelector('.hbov')?.remove();
  const ov=document.createElement('div'); ov.className='hbov';
  ov.innerHTML=`<div class="hbsheet" role="dialog" aria-label="Sổ tay lí thuyết">
    <div class="ltop"><button class="x" id="hbClose" aria-label="Đóng">${I.close(26)}</button><div class="btitle">Sổ tay lí thuyết</div></div>
    <div class="hbsearch"><input id="hbq" placeholder="Tìm: ẩn dụ, câu đặc biệt, lục bát…" value="${esc(HBQ)}" aria-label="Tìm trong sổ tay"></div>
    <div class="lbody" id="hbList"></div></div>`;
  document.body.appendChild(ov);
  const draw=()=>{
    const q=fold(HBQ.trim()); let h='', last='';
    HANDBOOK.forEach(s=>{
      const body=hbHTML(s); const hit=!q || fold(s.t+' '+body.replace(/<[^>]+>/g,' ')).includes(q);
      if(!hit) return;
      if(s.part!==last){ h+=`<div class="hbpart">${esc(s.part)}</div>`; last=s.part; }
      h+=`<details class="hbsec" id="hb-${s.id}" ${(openId===s.id||q)?'open':''}><summary>${esc(s.t)}</summary><div class="hbbody">${body}</div></details>`;
    });
    $('hbList').innerHTML= h || '<p class="note">Không tìm thấy mục phù hợp.</p>';
  };
  draw();
  $('hbq').oninput=e=>{ HBQ=e.target.value; draw(); };
  $('hbClose').onclick=()=>ov.remove();
  if(openId) requestAnimationFrame(()=>document.getElementById('hb-'+openId)?.scrollIntoView({block:'start'}));
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.querySelector('.tutor')){ closeTutor(); return; }
  if(e.key==='Escape'&&document.querySelector('.hbov')){ document.querySelector('.hbov').remove(); return; }
  if(document.querySelector('.hbov')) return;
  if(e.target.tagName==='TEXTAREA'||document.querySelector('.modal')||document.querySelector('.tutor')) return;
  if(e.key==='Enter'){ const b=$('next')||$('check')||$('go')||$('cont'); if(b&&!b.disabled){ e.preventDefault(); b.click(); } }
  else if(/^[1-4]$/.test(e.key) && e.target.tagName!=='INPUT' && screen==='lesson' && !Q.locked){ const o=document.querySelectorAll('.opt')[+e.key-1]; o&&o.click(); }
});
window.__curQ=()=>L&&L.queue&&L.queue[0]&&L.queue[0].q;
applyTheme(); home('learn');
(function splash(){ let seen=false; try{ seen=sessionStorage.getItem('tran-splash')==='1'; sessionStorage.setItem('tran-splash','1'); }catch(e){}
  if(seen||location.hash==='#test') return;
  const s=document.createElement('div'); s.className='splash';
  s.innerHTML=`<div class="splogo">${mascot('joy',{skin:'indigo',lv:0},'40 -2 104 104')}</div><div class="wm">Trăn</div><div class="tagl">Học mỗi ngày · Lớn mỗi ngày</div><div class="spbar"><i></i></div>`;
  document.body.appendChild(s); const go=()=>{ s.classList.add('out'); setTimeout(()=>s.remove(),400); }; s.onclick=go; setTimeout(go, matchMedia('(prefers-reduced-motion: reduce)').matches?300:1500);
})();
})();

</script>

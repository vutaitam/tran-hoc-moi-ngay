  Bal(['Cu','HNO3'],['Cu(NO3)2','NO2','H2O'],[1,4,1,2,2],'Cu nhường 2e, mỗi N⁺⁵ → N⁺⁴ nhận 1e → 2NO2; N: 2 + 2 = 4.',{q:'Cân bằng (HNO3 đặc)'}),
  Bal(['Mg','HNO3'],['Mg(NO3)2','N2O','H2O'],[4,10,4,1,5],'4Mg nhường 8e; 2N⁺⁵ → N2O (N⁺¹) nhận 8e; N: 8 + 2 = 10.',{q:'Thử thách: cân bằng'}),
  Bal(['KMnO4','HCl'],['KCl','MnCl2','Cl2','H2O'],[2,16,2,2,5,8],'2Mn nhận 10e, 10Cl⁻ → 5Cl2 nhường 10e; Cl: 2 + 4 + 10 = 16.',{q:'Thử thách: cân bằng'})],{deep:1,k:'Luyện đề'}),
 L('Kiểm tra, sửa lỗi và tổng hợp','Thói quen tốt: cân xong luôn đếm lại từng nguyên tố, kiểm tra hệ số tối giản, công thức đúng và điều kiện phản ứng.',[
  Bg('Chạm vào phương trình CHƯA cân bằng',['2Mg + O2 → 2MgO','Fe + 2HCl → FeCl2 + H2','Al + 3HCl → AlCl3 + H2','CH4 + 2O2 → CO2 + 2H2O'],2,'H: 3 bên trái, 2 bên phải. Đúng là 2Al + 6HCl → 2AlCl3 + 3H2.'),
  Bg('Chạm vào cách sửa SAI cho Na + O2 → Na2O',['4Na + O2 → 2Na2O','Na + O2 → NaO2','Đếm O: 2 bên trái nên cần 2Na2O','Đếm lại Na: 4 = 4'],1,'Đổi Na2O thành NaO2 là sửa chỉ số, tạo ra công thức khác.'),
  Bal(['Fe2O3','CO'],['Fe','CO2'],[1,3,2,3],'Mỗi CO lấy 1 O: 3 O của Fe2O3 cần 3CO → 3CO2, 2Fe.',{cond:'t°'}),
  Bal(['Fe(OH)2','O2','H2O'],['Fe(OH)3'],[4,1,2,4],'Fe: 4 → 4Fe(OH)3 (12 H, 12 O); 4Fe(OH)2 có 8 H, 8 O → thêm 2H2O (4 H, 2 O) và O2 (2 O).',{q:'Thử thách: cân bằng'}),
  Bal(['C2H5OH','Na'],['C2H5ONa','H2'],[2,2,2,1],'H2 cần 2 H của nhóm –OH → 2C2H5OH, 2Na.'),
  M('2H2O phân huỷ thành 2H2 + O2. Một bạn viết 4H2O → 4H2 + 2O2. Nhận xét nào đúng?',['Đúng số nguyên tử nhưng chưa tối giản','Hoàn toàn đúng','Sai vì thiếu O','Sai công thức'],'Chia tất cả cho 2.')],{k:'Luyện đề'})]},

{free:1,t:'Tính theo phương trình hoá học',s:'mol, khối lượng, thể tích khí, nồng độ',c:'#C4820A',gl:'n = m/M',lessons:[
 L('Mol và khối lượng mol','n = m : M (mol); m = n × M. Khối lượng mol M bằng tổng nguyên tử khối trong công thức (g/mol). Nguyên tử khối hay dùng: H = 1, C = 12, O = 16, Na = 23, Mg = 24, Al = 27, S = 32, Cl = 35,5, Ca = 40, Fe = 56, Cu = 64, Zn = 65.',[
  M('Khối lượng mol của H2SO4 là bao nhiêu?',['98 g/mol','96 g/mol','49 g/mol','100 g/mol'],'2 + 32 + 64 = 98.'),
  Y('Tính số mol của 5,6 g Fe.',['0,1','0.1'],'5,6 : 56 = 0,1 mol.'),
  M('Khối lượng của 0,5 mol NaOH là bao nhiêu?',['20 g','40 g','10 g','80 g'],'M(NaOH) = 40 → 0,5 × 40 = 20 g.'),
  Y('Khối lượng mol của Al2(SO4)3 là bao nhiêu?',['342'],'2 × 27 + 3 × (32 + 64) = 54 + 288 = 342.'),
  M('Khối lượng mol của CaCO3 là bao nhiêu?',['100 g/mol','84 g/mol','56 g/mol','106 g/mol'],'40 + 12 + 48 = 100.')]),
 L('Tính theo phương trình','Bốn bước: (1) viết và cân bằng phương trình; (2) đổi dữ kiện đề cho ra số mol; (3) theo tỉ lệ hệ số suy ra số mol chất cần tìm; (4) đổi ra khối lượng hoặc thể tích (khí ở đkc: V = n × 24,79 L).',[
  O('Sắp xếp các bước giải bài toán tính theo phương trình',['Viết và cân bằng phương trình hoá học','Đổi dữ kiện đề cho ra số mol','Dựa vào tỉ lệ hệ số tìm số mol chất cần tính','Đổi số mol ra khối lượng hoặc thể tích'],'Cân bằng sai thì mọi bước sau đều sai.'),
  Y('Cho 6,5 g Zn tác dụng hết với HCl. Số mol H2 thu được là bao nhiêu?',['0,1','0.1'],'n(Zn) = 6,5 : 65 = 0,1; tỉ lệ Zn : H2 = 1 : 1.','Zn + 2HCl → ZnCl2 + H2'),
  Y('Thể tích H2 (đkc) ở câu trên là bao nhiêu lít?',['2,479','2.479','2,48','2.48'],'0,1 × 24,79 = 2,479 L.'),
  Y('Khối lượng ZnCl2 tạo thành là bao nhiêu gam? (Zn = 65, Cl = 35,5)',['13,6','13.6'],'M(ZnCl2) = 136 → 0,1 × 136 = 13,6 g.'),
  M('Nung 10 g CaCO3 (phân huỷ hoàn toàn). Khối lượng CaO thu được là bao nhiêu?',['5,6 g','4,4 g','10 g','5 g'],'n(CaCO3) = 0,1 → n(CaO) = 0,1 → 0,1 × 56 = 5,6 g.','CaCO3 →{t°} CaO + CO2')]),
 L('Nồng độ dung dịch','Nồng độ phần trăm: C% = m(chất tan) : m(dung dịch) × 100%. Nồng độ mol: CM = n : V (V tính bằng lít). m(dung dịch) = m(chất tan) + m(dung môi).',[
  Y('Hoà tan 20 g NaCl vào nước được 200 g dung dịch. Tính C% (chỉ gõ số).',['10'],'20 : 200 × 100 = 10%.'),
  Y('0,2 mol NaOH trong 0,5 L dung dịch. Tính CM (chỉ gõ số).',['0,4','0.4'],'0,2 : 0,5 = 0,4 M.'),
  M('Trong 100 g dung dịch NaOH 8% có bao nhiêu gam NaOH?',['8 g','92 g','0,08 g','80 g'],'100 × 8% = 8 g.'),
  Y('Cần bao nhiêu mL dung dịch HCl 1 M để có 0,1 mol HCl?',['100'],'V = 0,1 : 1 = 0,1 L = 100 mL.'),
  M('Hoà tan 10 g đường vào 40 g nước. Nồng độ phần trăm là bao nhiêu?',['20%','25%','10%','40%'],'m(dd) = 10 + 40 = 50 g → 10 : 50 × 100 = 20%.')],{k:'Luyện đề'})]}
);
})();

const VAN=[
{t:'Truyện truyền kì',s:'Chuyện người con gái Nam Xương',c:'#9C4A2F',gl:'Nam Xương',lessons:[
 {card:{h:'Truyện truyền kì là gì?',p:'Truyện truyền kì là thể loại văn xuôi tự sự thời trung đại, viết bằng chữ Hán, kết hợp yếu tố hiện thực với yếu tố kì ảo (thần tiên, cõi âm, giấc mộng…). Qua đó, tác giả phản ánh hiện thực và gửi gắm tư tưởng. Tiêu biểu là Truyền kì mạn lục của Nguyễn Dữ (thế kỉ XVI), gồm 20 truyện.'},qs:[
  {t:'mc',q:'Truyền kì mạn lục được viết bằng chữ gì?',o:['Chữ Hán','Chữ Nôm','Chữ Quốc ngữ','Chữ Phạn'],a:0,w:'Truyện truyền kì thời trung đại được viết bằng chữ Hán.'},
  {t:'mc',q:'Đặc trưng nổi bật của truyện truyền kì là gì?',o:['Kết hợp yếu tố hiện thực với yếu tố kì ảo','Chỉ kể những chuyện có thật','Được viết bằng thơ lục bát','Luôn kết thúc có hậu'],a:0,w:'Yếu tố kì ảo đan xen với hiện thực là dấu hiệu nhận biết quan trọng nhất.'},
  {t:'mc',q:'Ai là tác giả của “Chuyện người con gái Nam Xương”?',o:['Nguyễn Dữ','Nguyễn Du','Ngô Thì Chí','Nguyễn Trãi'],a:0,w:'Đây là một truyện trong Truyền kì mạn lục của Nguyễn Dữ. Đừng nhầm với Nguyễn Du (tác giả Truyện Kiều).'},
  {t:'fill',q:'Hoàn thành nghĩa nhan đề',code:'“Truyền kì mạn lục” nghĩa là ghi chép tản mạn những chuyện ___ được lưu truyền.',bank:['kì lạ','lịch sử','cười','cổ tích'],a:['kì lạ'],w:'“Truyền kì”: truyền lại chuyện kì lạ; “mạn lục”: ghi chép tản mạn.'},
  {t:'bug',q:'Chạm vào phát biểu SAI',lines:['Truyện truyền kì thuộc văn xuôi tự sự trung đại','Yếu tố kì ảo giúp tác giả gửi gắm ước mơ về công lí','Truyện truyền kì hoàn toàn không phản ánh hiện thực xã hội','Truyền kì mạn lục gồm 20 truyện'],a:2,w:'Truyện truyền kì vẫn phản ánh hiện thực, yếu tố kì ảo chỉ là cách thể hiện.'}]},
 {card:{h:'Vũ Nương và nỗi oan',p:'Vũ Nương thuỳ mị, nết na, hiếu thảo với mẹ chồng, thuỷ chung với chồng. Trương Sinh đa nghi, ít học, nghe lời con nhỏ về “cái bóng” mà nghi oan vợ. Vũ Nương gieo mình xuống sông Hoàng Giang; được Linh Phi cứu, sống dưới thuỷ cung. Cuối truyện, nàng hiện về giữa dòng sông rồi biến mất.'},qs:[
  {t:'order',q:'Sắp xếp các sự việc theo đúng trình tự truyện',lines:['Vũ Nương lấy Trương Sinh','Trương Sinh đi lính, Vũ Nương ở nhà nuôi con, chăm mẹ chồng','Trương Sinh trở về, nghe lời con nhỏ, nghi oan vợ','Vũ Nương gieo mình xuống sông Hoàng Giang','Phan Lang gặp Vũ Nương dưới thuỷ cung','Vũ Nương hiện về giữa dòng sông rồi biến mất'],w:'Truyện đi từ hạnh phúc, chia li, nỗi oan, cái chết đến phần kì ảo ở thuỷ cung.'},
  {t:'mc',q:'Chi tiết “cái bóng” có vai trò gì trong truyện?',o:['Vừa là đầu mối gây nên nỗi oan, vừa là chi tiết giải oan cho Vũ Nương','Chỉ để tả cảnh đêm khuya','Thể hiện sự giàu có của gia đình','Là phép thuật của Linh Phi'],a:0,w:'Trò đùa chỉ bóng của Vũ Nương làm Trương Sinh nghi oan; về sau cũng chính cái bóng giúp chàng hiểu ra sự thật.'},
  {t:'mc',q:'Nguyên nhân sâu xa dẫn đến bi kịch của Vũ Nương là gì?',o:['Xã hội nam quyền bất công và chiến tranh phong kiến','Vũ Nương có lỗi thật','Mẹ chồng khắt khe','Phan Lang mách lẻo'],a:0,w:'Trương Sinh có quyền gia trưởng, đối xử hồ đồ với vợ; chiến tranh lại khiến vợ chồng xa cách.'},
  {t:'mc',q:'Tính cách nổi bật của Trương Sinh là gì?',o:['Đa nghi, hay ghen, ít học','Hiền lành, độ lượng','Học rộng, điềm tĩnh','Dũng cảm, mưu trí'],a:0,w:'Tính đa nghi cộng với tâm trạng không vui khi trở về khiến Trương Sinh dễ tin lời con trẻ.'},
  {t:'bug',q:'Chạm vào phát biểu SAI',lines:['Vũ Nương là người con dâu hiếu thảo','Trương Sinh nghi oan vợ vì nghe lời đứa con nhỏ','Vũ Nương bỏ nhà đi theo Phan Lang','Vũ Nương được Linh Phi cứu sống dưới thuỷ cung'],a:2,w:'Phan Lang chỉ là người cùng làng gặp lại Vũ Nương dưới thuỷ cung.'}]},
 {deep:1,card:{h:'Đào sâu: ý nghĩa và giá trị',p:'Phần kết kì ảo vừa thể hiện ước mơ về lẽ công bằng (người tốt được minh oan), vừa giữ tính bi kịch: Vũ Nương không thể trở về trần gian. Giá trị hiện thực: tố cáo xã hội phong kiến bất công. Giá trị nhân đạo: ngợi ca vẻ đẹp và cảm thông với số phận người phụ nữ. Truyện dựa trên truyện cổ tích “Vợ chàng Trương”.'},qs:[
  {t:'mc',q:'Vì sao Vũ Nương hiện về nhưng không trở lại trần gian?',o:['Cho thấy xã hội bất công không có chỗ cho người phụ nữ đức hạnh; bi kịch vẫn không thể hàn gắn','Vì nàng không còn thương chồng con','Vì Linh Phi không cho phép','Vì tác giả muốn truyện có kết thúc vui'],a:0,w:'Chi tiết này làm tăng ý nghĩa phê phán: dù được minh oan, hạnh phúc đã mất thì không lấy lại được.'},
  {t:'mc',q:'Yếu tố kì ảo trong truyện KHÔNG có tác dụng nào?',o:['Làm câu chuyện hoàn toàn xa rời hiện thực','Tạo sức hấp dẫn cho truyện','Hoàn thiện vẻ đẹp của nhân vật Vũ Nương','Thể hiện ước mơ về lẽ công bằng'],a:0,w:'Các chi tiết kì ảo vẫn gắn với địa danh, nhân vật cụ thể nên không làm truyện xa rời hiện thực.'},
  {t:'mc',q:'Lời nguyện của Vũ Nương trước khi gieo mình xuống sông thể hiện điều gì?',o:['Mong được chứng minh sự trong sạch, thuỷ chung','Trách móc mẹ chồng','Từ biệt Phan Lang','Cầu xin được giàu sang'],a:0,w:'Hành động tự vẫn kèm lời nguyện là cách nàng khẳng định phẩm giá của mình.'},
  {t:'fill',q:'Điền tên hai giá trị của tác phẩm',code:'Giá trị ___ : tố cáo xã hội phong kiến bất công. Giá trị ___ : ngợi ca và cảm thông với người phụ nữ.',bank:['hiện thực','nhân đạo','nghệ thuật','lịch sử'],a:['hiện thực','nhân đạo'],w:'Đây là hai giá trị cần nêu được khi phân tích một tác phẩm văn học trung đại.'},
  {t:'mc',q:'Nguyễn Dữ dựa vào truyện dân gian nào để viết truyện này?',o:['Vợ chàng Trương','Sự tích Hòn Vọng Phu','Tấm Cám','Thạch Sanh'],a:0,w:'Nguyễn Dữ dựa trên cổ tích “Vợ chàng Trương” nhưng thêm nhiều chi tiết, nhất là phần kì ảo ở thuỷ cung.'}]}],
 boss:{q:'Viết đoạn văn (khoảng 150–200 chữ) phân tích ý nghĩa của chi tiết “cái bóng” trong “Chuyện người con gái Nam Xương”.',crit:'Có câu chủ đề rõ ràng; nêu được: cái bóng xuất phát từ tình thương con, nhớ chồng của Vũ Nương; là nguyên nhân trực tiếp gây nỗi oan; cũng là chi tiết giải oan khi Trương Sinh hiểu ra; ý nghĩa: tố cáo sự đa nghi, gia trưởng và xã hội nam quyền, làm câu chuyện bất ngờ, hấp dẫn. Diễn đạt mạch lạc, đúng chính tả, độ dài phù hợp.',sol:'Dàn ý gợi ý (em tự viết thành đoạn):\n– Câu chủ đề: “cái bóng” là chi tiết nghệ thuật đặc sắc, giữ vai trò then chốt của truyện.\n– Nguồn gốc: trò đùa của Vũ Nương vì thương con, mong con có cha bên cạnh.\n– Thắt nút: bé Đản tưởng là người thật, Trương Sinh đa nghi nên nghi oan vợ.\n– Mở nút: khi cái bóng xuất hiện lại, Trương Sinh mới hiểu ra thì đã muộn.\n– Ý nghĩa: tố cáo sự hồ đồ, gia trưởng; làm truyện kịch tính, bất ngờ.\n– Câu kết: khái quát giá trị của chi tiết.'}},

{t:'Thơ song thất lục bát',s:'Chinh phụ ngâm và biện pháp tu từ',c:'#2F6E8F',gl:'7 7 6 8',lessons:[
 {card:{h:'Thể song thất lục bát',p:'Mỗi khổ gồm 4 câu: hai câu bảy chữ (song thất), tiếp đến một câu sáu chữ và một câu tám chữ (lục bát). Câu bảy chữ thường ngắt nhịp 3/4; cặp lục bát thường ngắt nhịp chẵn. Thể thơ có cả vần trắc và vần bằng, vừa vần chân vừa vần lưng, rất hợp để diễn tả tâm trạng triền miên.'},qs:[
  {t:'mc',q:'Một khổ thơ song thất lục bát có mấy câu?',o:['4 câu','2 câu','6 câu','8 câu'],a:0,w:'7 – 7 – 6 – 8: bốn câu tạo thành một khổ.'},
  {t:'fill',q:'Hoàn thành cấu trúc khổ thơ',code:'Hai câu ___ chữ, tiếp theo là một câu ___ chữ và một câu tám chữ.',bank:['7','6','5','8'],a:['7','6'],w:'Song thất (hai câu bảy) rồi lục bát (sáu – tám).'},
  {t:'mc',q:'Câu bảy chữ trong thể song thất lục bát thường ngắt nhịp thế nào?',o:['3/4','4/3','2/2/3','2/5'],a:0,w:'Nhịp 3/4 của câu thất khác với nhịp 4/3 thường gặp trong thơ Đường luật.'},
  {t:'mc',q:'Nguyên tác chữ Hán của “Chinh phụ ngâm” là của ai?',o:['Đặng Trần Côn','Đoàn Thị Điểm','Nguyễn Du','Hồ Xuân Hương'],a:0,w:'Đặng Trần Côn viết bằng chữ Hán; bản diễn Nôm nổi tiếng tương truyền của Đoàn Thị Điểm.'},
  {t:'bug',q:'Chạm vào phát biểu SAI',lines:['Song thất lục bát là thể thơ dân tộc','Thể thơ này vừa có vần chân vừa có vần lưng','Mỗi khổ song thất lục bát gồm 4 câu','Thể song thất lục bát chỉ dùng vần bằng'],a:3,w:'Thể thơ này phối hợp cả vần trắc (ở cặp câu bảy) và vần bằng.'}]},
 {card:{h:'Nỗi niềm người chinh phụ',p:'Người chinh phụ có chồng ra trận, ở nhà cô đơn, ngóng tin, chỉ có ngọn đèn làm bạn. Tác giả dùng bút pháp tả cảnh ngụ tình: mượn cảnh để nói tâm trạng. Tác phẩm cảm thông với khát khao hạnh phúc lứa đôi và gián tiếp lên án chiến tranh phong kiến.',code:'Đèn có biết dường bằng chẳng biết,\nLòng thiếp riêng bi thiết mà thôi.\n(Chinh phụ ngâm)'},qs:[
  {t:'mc',q:'Hai câu thơ trong thẻ bí kíp cho thấy điều gì?',o:['Người chinh phụ cô đơn, chỉ có ngọn đèn làm bạn mà đèn cũng không thấu nỗi lòng','Người chinh phụ vui vẻ bên ngọn đèn','Người chinh phụ trách móc chồng','Ngọn đèn là quà chồng tặng'],a:0,w:'Hỏi đèn rồi tự trả lời “chẳng biết”: nỗi buồn chỉ một mình mình mang, không ai sẻ chia.'},
  {t:'mc',q:'Bút pháp “tả cảnh ngụ tình” nghĩa là gì?',o:['Mượn cảnh vật để gửi gắm tâm trạng','Tả cảnh thật chi tiết, không có cảm xúc','Kể sự việc theo trình tự thời gian','Dùng thật nhiều từ Hán Việt'],a:0,w:'Cảnh không chỉ là cảnh: mỗi hình ảnh đều nhuốm tâm trạng nhân vật.'},
  {t:'mc',q:'Tác phẩm gián tiếp lên án điều gì?',o:['Chiến tranh phong kiến gây chia lìa đôi lứa','Thói xấu của người chinh phụ','Cảnh nghèo đói','Thiên tai lũ lụt'],a:0,w:'Nỗi đau của người chinh phụ bắt nguồn từ cảnh chồng phải ra trận.'},
  {t:'type',q:'Chữ cuối câu bảy thứ hai vần với chữ cuối câu mấy chữ? Gõ số.',a:['6','sáu','câu lục','lục'],w:'Chữ cuối câu thất thứ hai (vần bằng) vần với chữ cuối câu sáu (câu lục).'},
  {t:'bug',q:'Chạm vào phát biểu SAI',lines:['Người chinh phụ mong ngóng tin chồng','Nỗi nhớ của người chinh phụ trải dài theo thời gian và không gian','Người chinh phụ hạnh phúc vì chồng đi xa lập công','Bản diễn Nôm tương truyền của Đoàn Thị Điểm'],a:2,w:'Người chinh phụ đau khổ, cô đơn; khao khát đoàn tụ chứ không vui vì công danh.'}]},
 {deep:1,card:{h:'Đào sâu: biện pháp tu từ',p:'Ẩn dụ: gọi tên sự vật này bằng tên sự vật khác có nét tương đồng. Hoán dụ: gọi tên bằng sự vật có quan hệ gần gũi (bộ phận – toàn thể, nơi chốn – con người…). Nhân hoá: gán cho vật đặc điểm của người. Điệp ngữ: lặp từ ngữ để nhấn mạnh. Câu hỏi tu từ: hỏi không cần trả lời, để bộc lộ cảm xúc.',code:'Thuyền về có nhớ bến chăng,\nBến thì một dạ khăng khăng đợi thuyền.\n(Ca dao)'},qs:[
  {t:'mc',q:'Trong câu ca dao ở thẻ bí kíp, “thuyền” và “bến” là biện pháp gì?',o:['Ẩn dụ','Hoán dụ','Nói quá','Liệt kê'],a:0,w:'“Thuyền” chỉ người con trai hay đi xa, “bến” chỉ người con gái chung thuỷ chờ đợi: dựa trên nét tương đồng.'},
  {t:'mc',q:'“Cả làng kéo nhau đi xem hội.” Từ “làng” dùng biện pháp gì?',o:['Hoán dụ','Ẩn dụ','So sánh','Điệp ngữ'],a:0,w:'“Làng” chỉ người dân trong làng: lấy nơi chốn để gọi con người sống ở đó.'},
  {t:'mc',q:'Câu hỏi tu từ là gì?',o:['Câu hỏi không nhằm lấy câu trả lời mà để bộc lộ cảm xúc, nhấn mạnh','Câu hỏi để hỏi thông tin','Câu hỏi luôn kết thúc bằng dấu chấm than','Câu hỏi chỉ dùng trong văn nghị luận'],a:0,w:'Ví dụ “Đèn có biết…?” — người chinh phụ không chờ đèn trả lời.'},
  {t:'fill',q:'Điền tên biện pháp tu từ',code:'Trăm năm trong cõi người ta,\nChữ tài chữ mệnh khéo là ghét nhau.\nViệc lặp lại từ “chữ” là biện pháp ___.',bank:['điệp ngữ','so sánh','nói giảm','liệt kê'],a:['điệp ngữ'],w:'Lặp “chữ” nhấn mạnh hai khái niệm tài và mệnh. (Còn “ghét nhau” là nhân hoá.)'},
  {t:'mc',q:'“Trâu ơi ta bảo trâu này” (ca dao) dùng biện pháp gì?',o:['Nhân hoá','Hoán dụ','Nói quá','Liệt kê'],a:0,w:'Trò chuyện với con trâu như với người là một cách nhân hoá.'}]}],
 boss:{q:'Viết đoạn văn (khoảng 150–200 chữ) trình bày cảm nhận của em về nỗi cô đơn của người chinh phụ qua hai câu “Đèn có biết dường bằng chẳng biết, / Lòng thiếp riêng bi thiết mà thôi.” Trong đoạn có dùng ít nhất một câu hỏi tu từ và ghi rõ ở cuối đoạn.',crit:'Có câu chủ đề; nêu được: hình ảnh ngọn đèn làm bạn trong đêm khuya, câu hỏi “đèn có biết” và tự trả lời “chẳng biết” cho thấy không ai thấu hiểu; từ “riêng”, “bi thiết” nhấn mạnh nỗi buồn một mình; liên hệ cảm thông và thái độ với chiến tranh. Có một câu hỏi tu từ đúng và chỉ ra được. Diễn đạt mạch lạc, đúng chính tả.',sol:'Dàn ý gợi ý (em tự viết thành đoạn):\n– Câu chủ đề: hai câu thơ khắc hoạ sâu sắc nỗi cô đơn của người chinh phụ.\n– Hình ảnh ngọn đèn: người bạn duy nhất trong đêm dài.\n– Cách hỏi rồi tự trả lời: không ai, không vật gì thấu hiểu nỗi lòng.\n– Từ ngữ “riêng”, “bi thiết”: nỗi buồn chỉ một mình gánh chịu.\n– Liên hệ: cảm thông, nhận ra nỗi đau do chiến tranh gây ra.\n– Gợi ý câu hỏi tu từ: một câu hỏi bày tỏ cảm xúc của em, không cần trả lời.'}},

{t:'Truyện Kiều',s:'Nguyễn Du và nghệ thuật truyện thơ Nôm',c:'#7A3E8E',gl:'3254 câu',lessons:[
 {card:{h:'Nguyễn Du và Truyện Kiều',p:'Nguyễn Du (1765–1820) là đại thi hào dân tộc. Truyện Kiều, tên chữ Hán là Đoạn trường tân thanh, là truyện thơ Nôm viết bằng thể lục bát, gồm 3254 câu. Cốt truyện dựa trên Kim Vân Kiều truyện của Thanh Tâm Tài Nhân (Trung Quốc), nhưng Nguyễn Du sáng tạo rất lớn về nghệ thuật. Truyện gồm ba phần: gặp gỡ và đính ước, gia biến và lưu lạc, đoàn tụ.'},qs:[
  {t:'mc',q:'Truyện Kiều được viết bằng thể thơ nào?',o:['Lục bát','Song thất lục bát','Thất ngôn bát cú','Thơ tự do'],a:0,w:'Truyện Kiều là truyện thơ Nôm viết bằng thể lục bát, thể thơ dân tộc.'},
  {t:'type',q:'Truyện Kiều gồm bao nhiêu câu thơ? Gõ số.',a:['3254','3.254'],w:'Truyện Kiều gồm 3254 câu thơ lục bát.'},
  {t:'mc',q:'Tên chữ Hán của Truyện Kiều là gì?',o:['Đoạn trường tân thanh','Truyền kì mạn lục','Chinh phụ ngâm','Hoàng Lê nhất thống chí'],a:0,w:'“Đoạn trường tân thanh” nghĩa là tiếng kêu mới về nỗi đau đứt ruột.'},
  {t:'mc',q:'Nguyễn Du dựa vào cốt truyện của tác phẩm nào?',o:['Kim Vân Kiều truyện của Thanh Tâm Tài Nhân','Tam quốc diễn nghĩa','Liêu trai chí dị','Truyền kì mạn lục'],a:0,w:'Nguyễn Du mượn cốt truyện nhưng sáng tạo lại bằng nghệ thuật kể chuyện và miêu tả tâm lí bậc thầy.'},
  {t:'order',q:'Sắp xếp ba phần của Truyện Kiều',lines:['Gặp gỡ và đính ước','Gia biến và lưu lạc','Đoàn tụ'],w:'Kiều gặp Kim Trọng, gia đình gặp nạn nên Kiều lưu lạc mười lăm năm, cuối cùng đoàn tụ.'}]},
 {card:{h:'Nghệ thuật tả người',p:'Nguyễn Du dùng bút pháp ước lệ tượng trưng: lấy vẻ đẹp thiên nhiên làm chuẩn mực để tả người. Vẻ đẹp Thuý Vân khiến thiên nhiên “thua”, “nhường”, báo hiệu cuộc đời êm ả. Vẻ đẹp Thuý Kiều khiến thiên nhiên “ghen”, “hờn”, báo hiệu số phận truân chuyên. Tả Vân trước làm nền để tôn vẻ đẹp của Kiều.',code:'Hoa cười ngọc thốt đoan trang,\nMây thua nước tóc tuyết nhường màu da.\n…\nLàn thu thuỷ nét xuân sơn,\nHoa ghen thua thắm liễu hờn kém xanh.'},qs:[
  {t:'mc',q:'“Mây thua nước tóc tuyết nhường màu da” dùng bút pháp gì?',o:['Ước lệ tượng trưng','Tả thực','Trào phúng','Liệt kê'],a:0,w:'Lấy mây, tuyết làm chuẩn để nói tóc, da: đó là bút pháp ước lệ của văn học trung đại.'},
  {t:'mc',q:'Vì sao chân dung Thuý Kiều báo hiệu một số phận truân chuyên?',o:['Vẻ đẹp của Kiều khiến thiên nhiên phải “ghen”, “hờn”','Vì Kiều không đẹp bằng Vân','Vì Kiều hay buồn','Vì nhà Kiều nghèo'],a:0,w:'Thiên nhiên đố kị với vẻ đẹp ấy, gợi quan niệm “hồng nhan bạc mệnh”.'},
  {t:'fill',q:'Điền nghĩa của hình ảnh ước lệ',code:'“Làn thu thuỷ” (nước mùa thu) tả ___; “nét xuân sơn” (núi mùa xuân) tả ___.',bank:['đôi mắt','lông mày','mái tóc','làn da'],a:['đôi mắt','lông mày'],w:'Mắt trong như nước mùa thu, lông mày thanh như dáng núi mùa xuân.'},
  {t:'mc',q:'Hai câu “Trăm năm trong cõi người ta, / Chữ tài chữ mệnh khéo là ghét nhau” nói về quan niệm nào?',o:['Tài năng và số mệnh thường đối nghịch nhau','Có tài thì giàu sang','Số mệnh do mình quyết định','Người tài luôn hạnh phúc'],a:0,w:'Đây là quan niệm “tài mệnh tương đố” mở đầu Truyện Kiều.'},
  {t:'bug',q:'Chạm vào phát biểu SAI',lines:['Thuý Vân có vẻ đẹp đoan trang, phúc hậu','Thuý Kiều vừa sắc sảo về trí tuệ vừa tài hoa','Nguyễn Du tả Thuý Vân trước để đề cao Vân hơn Kiều','Bút pháp ước lệ lấy thiên nhiên làm chuẩn mực cho cái đẹp'],a:2,w:'Tả Vân trước là thủ pháp đòn bẩy, làm nền để vẻ đẹp của Kiều nổi bật hơn.'}]},
 {deep:1,card:{h:'Đào sâu: tả cảnh ngụ tình',p:'Ở lầu Ngưng Bích, Kiều nhớ Kim Trọng trước rồi nhớ cha mẹ. Tám câu cuối đoạn dùng điệp ngữ “Buồn trông” mở đầu mỗi cặp câu; cảnh được nhìn qua tâm trạng Kiều, đi từ xa đến gần, màu sắc từ nhạt đến đậm, âm thanh từ tĩnh đến động, nỗi buồn tăng dần đến lo sợ.',code:'Buồn trông cửa bể chiều hôm,\nThuyền ai thấp thoáng cánh buồm xa xa?\n…\nBuồn trông gió cuốn mặt duềnh,\nẦm ầm tiếng sóng kêu quanh ghế ngồi.'},qs:[
  {t:'mc',q:'Điệp ngữ “Buồn trông” trong tám câu cuối có tác dụng gì?',o:['Diễn tả nỗi buồn trùng điệp, tăng dần','Liệt kê các cảnh đẹp','Thể hiện niềm vui','Giới thiệu nhân vật mới'],a:0,w:'Mỗi lần “buồn trông” là một lớp buồn mới, như những đợt sóng lòng dâng lên.'},
  {t:'mc',q:'Hai câu “Buồn trông gió cuốn mặt duềnh, / Ầm ầm tiếng sóng kêu quanh ghế ngồi” gợi tâm trạng gì?',o:['Lo sợ, hãi hùng trước những tai hoạ sắp ập đến','Thanh thản, bình yên','Hạnh phúc, mãn nguyện','Hăng hái, phấn chấn'],a:0,w:'Âm thanh dữ dội, gió sóng vây quanh: dự cảm về giông tố cuộc đời Kiều.'},
  {t:'mc',q:'Ở lầu Ngưng Bích, Kiều nhớ ai trước?',o:['Kim Trọng','Cha mẹ','Thuý Vân','Từ Hải'],a:0,w:'Kiều đã bán mình chuộc cha, phần nào làm tròn chữ hiếu, nên nỗi day dứt về mối tình với Kim Trọng hiện lên trước.'},
  {t:'fill',q:'Hoàn thành nhận xét',code:'Biện pháp ___ là mượn cảnh để nói tình; ở lầu Ngưng Bích, cảnh được nhìn qua ___ của Kiều.',bank:['tả cảnh ngụ tình','tâm trạng','liệt kê','trang phục'],a:['tả cảnh ngụ tình','tâm trạng'],w:'“Người buồn cảnh có vui đâu bao giờ” — cũng là một câu trong Truyện Kiều.'},
  {t:'order',q:'Sắp xếp các cảnh theo đúng thứ tự trong tám câu cuối',lines:['Cửa bể chiều hôm, cánh buồm xa xa','Ngọn nước mới sa, hoa trôi man mác','Nội cỏ rầu rầu, chân mây mặt đất một màu xanh xanh','Gió cuốn mặt duềnh, tiếng sóng ầm ầm'],w:'Thứ tự cảnh cũng là thứ tự nỗi buồn tăng dần, từ man mác đến hãi hùng.'}]}],
 boss:{q:'Viết đoạn văn (khoảng 150–200 chữ) phân tích tác dụng của điệp ngữ “Buồn trông” trong tám câu cuối đoạn Kiều ở lầu Ngưng Bích.',crit:'Có câu chủ đề; chỉ ra điệp ngữ lặp bốn lần mở đầu các cặp câu; phân tích được ít nhất hai cảnh và tâm trạng tương ứng; thấy được nỗi buồn tăng dần, nhịp điệu như sóng lòng; có trích dẫn thơ đúng cách; nhận xét về nghệ thuật tả cảnh ngụ tình. Diễn đạt mạch lạc, đúng chính tả.',sol:'Dàn ý gợi ý (em tự viết thành đoạn):\n– Câu chủ đề: điệp ngữ “Buồn trông” là nét đặc sắc của tám câu thơ.\n– Nhận diện: lặp bốn lần, mở đầu mỗi cặp lục bát.\n– Tác dụng 1: tạo nhịp điệu trầm buồn, như những đợt sóng lòng.\n– Tác dụng 2: nối các bức tranh cảnh, mỗi cảnh một nỗi buồn (cánh buồm, hoa trôi, nội cỏ, gió sóng).\n– Tác dụng 3: nỗi buồn tăng dần, kết ở nỗi lo sợ.\n– Câu kết: khẳng định tài tả cảnh ngụ tình của Nguyễn Du.'}},

{t:'Truyện lịch sử',s:'Hoàng Lê nhất thống chí – hồi thứ mười bốn',c:'#8A6A1F',gl:'1789',lessons:[
 {card:{h:'Truyện lịch sử',p:'Truyện lịch sử dựa trên sự kiện và nhân vật lịch sử có thật, có hư cấu nghệ thuật. Hoàng Lê nhất thống chí là tiểu thuyết chương hồi viết bằng chữ Hán của nhóm Ngô gia văn phái (chủ yếu Ngô Thì Chí, Ngô Thì Du). Hồi thứ mười bốn kể việc vua Quang Trung đại phá quân Thanh vào mùa xuân năm 1789.'},qs:[
  {t:'mc',q:'Tác giả của Hoàng Lê nhất thống chí là ai?',o:['Ngô gia văn phái','Nguyễn Dữ','Lê Hữu Trác','Phạm Đình Hổ'],a:0,w:'Ngô gia văn phái là nhóm tác giả dòng họ Ngô Thì ở làng Tả Thanh Oai (nay thuộc Hà Nội).'},
  {t:'mc',q:'Hoàng Lê nhất thống chí thuộc thể loại nào?',o:['Tiểu thuyết chương hồi','Truyện truyền kì','Thơ song thất lục bát','Truyện thơ Nôm'],a:0,w:'Tác phẩm chia thành nhiều hồi, mỗi hồi kể trọn một phần câu chuyện.'},
  {t:'mc',q:'Hồi thứ mười bốn kể sự kiện nào?',o:['Quang Trung đại phá quân Thanh','Lê Lợi khởi nghĩa Lam Sơn','Trần Hưng Đạo đánh quân Nguyên','Ngô Quyền đánh quân Nam Hán'],a:0,w:'Hồi 14 tái hiện chiến thắng thần tốc của Quang Trung mùa xuân Kỉ Dậu.'},
  {t:'type',q:'Quang Trung đại phá quân Thanh vào mùa xuân năm nào? Gõ số.',a:['1789'],w:'Mùa xuân Kỉ Dậu 1789.'},
  {t:'bug',q:'Chạm vào phát biểu SAI',lines:['Truyện lịch sử dựa trên sự kiện và nhân vật có thật','Truyện lịch sử có thể có hư cấu nghệ thuật','Hoàng Lê nhất thống chí được viết bằng chữ Nôm','Tác phẩm được viết theo lối chương hồi'],a:2,w:'Tác phẩm được viết bằng chữ Hán.'}]},
 {card:{h:'Người anh hùng Quang Trung',p:'Quang Trung hành động mạnh mẽ, quyết đoán: lên ngôi rồi lập tức xuất quân. Ông sáng suốt trong phân tích tình hình và dùng người, có tầm nhìn xa khi tính sẵn kế hoà hiếu sau chiến thắng. Cuộc hành quân thần tốc, vừa đi vừa đánh; ông vào Thăng Long sớm hơn ngày đã hẹn. Trái lại, quân Thanh và vua tôi Lê Chiêu Thống tháo chạy thảm hại.'},qs:[
  {t:'mc',q:'Việc Quang Trung hẹn ngày mồng 7 Tết sẽ vào Thăng Long mở tiệc thể hiện điều gì?',o:['Sự tự tin và tầm nhìn chiến lược','Sự chủ quan, coi thường địch','Tính ham chơi','Nỗi sợ hãi'],a:0,w:'Lời hẹn dựa trên sự tính toán kĩ lưỡng, và thực tế ông còn vào thành sớm hơn.'},
  {t:'mc',q:'Vì sao nhóm tác giả trung thành với nhà Lê vẫn viết chân thực về chiến công của Quang Trung?',o:['Vì tôn trọng sự thật lịch sử và có ý thức dân tộc','Vì được Quang Trung trả công','Vì ghét nhà Lê','Vì muốn viết truyện kì ảo'],a:0,w:'Đây là điểm đáng quý của tác phẩm: sự thật và lòng tự hào dân tộc vượt lên trên lập trường phe phái.'},
  {t:'mc',q:'Tác giả miêu tả Tôn Sĩ Nghị (tướng nhà Thanh) với thái độ gì?',o:['Châm biếm sự kiêu căng, hèn nhát','Ca ngợi tài cầm quân','Khâm phục','Trung lập, không bộc lộ'],a:0,w:'Viên tướng kiêu ngạo lúc đầu, đến khi thua thì hoảng sợ bỏ chạy.'},
  {t:'fill',q:'Điền từ phù hợp',code:'Cuộc hành quân của Quang Trung diễn ra ___ : vừa đi vừa đánh, vào Thăng Long sớm hơn dự định.',bank:['thần tốc','chậm chạp','rụt rè','lén lút'],a:['thần tốc'],w:'“Thần tốc”: nhanh như thần, nét nổi bật nhất của chiến dịch.'},
  {t:'bug',q:'Chạm vào phát biểu SAI',lines:['Quang Trung lên ngôi hoàng đế trước khi ra Bắc','Quang Trung trực tiếp cầm quân, xông pha trận mạc','Quân Thanh chống trả quyết liệt rồi rút lui trong trật tự','Quang Trung vào Thăng Long sớm hơn ngày đã hẹn'],a:2,w:'Quân Thanh tan rã, tháo chạy hỗn loạn, giẫm đạp lên nhau.'}]},
 {deep:1,card:{h:'Đào sâu: nghệ thuật kể và từ Hán Việt',p:'Hồi 14 kể theo ngôi thứ ba, nhịp nhanh, chú trọng sự kiện. Thủ pháp tương phản đặt khí thế của quân Tây Sơn cạnh cảnh tháo chạy của quân Thanh và vua tôi Lê Chiêu Thống. Truyện lịch sử dùng nhiều từ Hán Việt; hiểu nghĩa từng yếu tố giúp hiểu nghĩa cả từ.'},qs:[
  {t:'mc',q:'Đặt chiến thắng của quân Tây Sơn cạnh cảnh tháo chạy của quân Thanh là thủ pháp gì?',o:['Tương phản','Điệp ngữ','Nhân hoá','Nói giảm'],a:0,w:'Tương phản làm nổi bật tầm vóc người anh hùng và sự thảm bại của kẻ xâm lược.'},
  {t:'mc',q:'Từ Hán Việt “thần tốc” nghĩa là gì?',o:['Nhanh như thần','Chậm rãi','Thần bí','Thần thánh hoá'],a:0,w:'“Thần”: thần; “tốc”: nhanh.'},
  {t:'mc',q:'Từ Hán Việt “hoà hiếu” nghĩa là gì?',o:['Giữ quan hệ hoà bình, thân thiện','Đánh nhau','Hoà vốn','Hiếu thảo'],a:0,w:'Sau chiến thắng, Quang Trung tính kế giữ hoà hiếu với nhà Thanh để tránh chiến tranh kéo dài.'},
  {t:'mc',q:'Lời kể trong hồi thứ mười bốn chủ yếu theo ngôi nào?',o:['Ngôi thứ ba','Ngôi thứ nhất','Ngôi thứ hai','Không có người kể'],a:0,w:'Người kể đứng ngoài câu chuyện, kể khách quan về các sự kiện.'},
  {t:'fill',q:'Điền nghĩa của yếu tố Hán Việt',code:'Trong từ “quốc gia”, “quốc” nghĩa là ___, “gia” nghĩa là ___.',bank:['nước','nhà','người','đất'],a:['nước','nhà'],w:'“Quốc gia”: nước nhà. Cùng yếu tố “quốc”: quốc kì, quốc ca, ái quốc.'}]}],
 boss:{q:'Viết đoạn văn (khoảng 150–200 chữ) về hình ảnh người anh hùng Quang Trung – Nguyễn Huệ qua hồi thứ mười bốn của Hoàng Lê nhất thống chí.',crit:'Có câu chủ đề; nêu ít nhất hai phẩm chất (quyết đoán, sáng suốt, có tầm nhìn xa, tài dụng binh, lẫm liệt) kèm sự việc làm dẫn chứng (được kể lại bằng lời của em); nhận xét nghệ thuật (tương phản, nhịp kể nhanh) hoặc thái độ của tác giả; diễn đạt mạch lạc, đúng chính tả.',sol:'Dàn ý gợi ý (em tự viết thành đoạn):\n– Câu chủ đề: Quang Trung hiện lên là người anh hùng dân tộc có tầm vóc lớn.\n– Quyết đoán: lên ngôi, lập tức xuất quân ra Bắc.\n– Sáng suốt, có tầm nhìn: hẹn ngày vào Thăng Long, tính trước kế hoà hiếu.\n– Tài dụng binh: hành quân thần tốc, vừa đi vừa đánh.\n– Lẫm liệt: trực tiếp chỉ huy trận đánh.\n– Nghệ thuật: tương phản với quân Thanh; nhóm tác giả vẫn viết chân thực.\n– Câu kết: niềm tự hào về người anh hùng.'}},

{t:'Thực hành tiếng Việt',s:'điển cố, chơi chữ, nói quá, lời dẫn',c:'#2E7D5B',gl:'“…”',lessons:[
 {card:{h:'Điển tích, điển cố và từ Hán Việt',p:'Điển cố là câu chuyện, sự việc trong sách xưa được dẫn lại ngắn gọn để gợi ý nghĩa sâu xa, ví dụ “Tái ông thất mã” (ông lão ở biên ải mất ngựa: trong rủi có may). Từ Hán Việt là từ gốc Hán đọc theo âm Việt, thường mang sắc thái trang trọng.'},qs:[
  {t:'mc',q:'Điển cố là gì?',o:['Sự việc hoặc câu chữ trong sách xưa được dẫn ngắn gọn để gợi ý nghĩa sâu xa','Từ mượn tiếng Anh','Một loại từ láy','Một câu ca dao'],a:0,w:'Chỉ vài chữ nhưng gợi cả một câu chuyện, nên điển cố rất hàm súc.'},
  {t:'mc',q:'“Tái ông thất mã” khuyên ta điều gì?',o:['Trong rủi có may, đừng vội buồn vui','Phải giữ ngựa thật cẩn thận','Không nên nuôi ngựa','Già thì nên nghỉ ngơi'],a:0,w:'Ông lão mất ngựa, ngựa lại dẫn ngựa tốt về; con trai cưỡi ngựa gãy chân nhưng nhờ vậy thoát cảnh đi lính.'},
  {t:'mc',q:'“Nước đổ đầu vịt” là gì?',o:['Thành ngữ chỉ việc nói mãi mà không có tác dụng','Một điển cố Trung Hoa','Một câu đố','Tục ngữ về thời tiết'],a:0,w:'Nước đổ lên lông vịt thì trôi tuột đi, giống lời nói không vào tai người nghe.'},
  {t:'fill',q:'Điền nghĩa của yếu tố Hán Việt',code:'Trong từ “thiên nhiên”, “thiên” nghĩa là ___.',bank:['trời','nghìn','nghiêng','đường'],a:['trời'],w:'“Thiên” có nhiều nghĩa (trời, nghìn…); trong “thiên nhiên”, “thiên” là trời.'},
  {t:'mc',q:'Từ nào là từ Hán Việt?',o:['Giang sơn','Sông núi','Đất nước','Làng xóm'],a:0,w:'“Giang” là sông, “sơn” là núi: giang sơn là cách nói Hán Việt của sông núi.'}]},
 {card:{h:'Chơi chữ, nói quá, nói giảm',p:'Chơi chữ lợi dụng đặc sắc về âm, về nghĩa của từ để tạo sự dí dỏm (đồng âm, gần âm, nói lái…). Nói quá phóng đại mức độ để nhấn mạnh. Nói giảm nói tránh diễn đạt tế nhị để tránh gây đau buồn, ghê sợ hoặc thô tục.',code:'Bà già đi chợ Cầu Đông,\nBói xem một quẻ lấy chồng lợi chăng?\nThầy bói xem quẻ nói rằng:\nLợi thì có lợi nhưng răng không còn.\n(Ca dao)'},qs:[
  {t:'mc',q:'Trong câu ca dao ở thẻ bí kíp, từ “lợi” được dùng để làm gì?',o:['Chơi chữ đồng âm: “lợi” là có lợi và “lợi” là nướu răng','So sánh','Nhân hoá','Liệt kê'],a:0,w:'Thầy bói “trả lời” đúng một chữ nhưng hiểu theo nghĩa khác, tạo tiếng cười hóm hỉnh.'},
  {t:'mc',q:'“Ông ấy đã về với tổ tiên.” Câu này dùng biện pháp gì?',o:['Nói giảm nói tránh','Nói quá','Chơi chữ','Hoán dụ'],a:0,w:'Thay cho từ “chết” để giảm cảm giác đau buồn.'},
  {t:'mc',q:'“Lỗ mũi mười tám gánh lông” (ca dao). Cụm “mười tám gánh lông” là biện pháp gì?',o:['Nói quá','Nói giảm','Ẩn dụ','Điệp ngữ'],a:0,w:'Phóng đại đến mức phi lí để gây cười.'},
  {t:'bug',q:'Chạm vào câu KHÔNG dùng biện pháp nói quá',lines:['Đen như cột nhà cháy','Ngáy như sấm','Nó học bài suốt hai tiếng','Dời non lấp biển'],a:2,w:'“Học bài suốt hai tiếng” chỉ kể sự thật, không phóng đại.'},
  {t:'mc',q:'Nói giảm nói tránh có tác dụng gì?',o:['Tránh gây cảm giác đau buồn, ghê sợ, thô tục; thể hiện sự tế nhị','Phóng đại sự việc','Gây cười','Liệt kê sự việc'],a:0,w:'Ví dụ nói “bạn ấy học chưa tốt lắm” thay cho “bạn ấy học kém”.'}]},
 {deep:1,card:{h:'Đào sâu: lời dẫn và câu đúng',p:'Dẫn trực tiếp: giữ nguyên lời, đặt trong dấu ngoặc kép, thường sau dấu hai chấm. Dẫn gián tiếp: thuật lại có điều chỉnh, không dùng ngoặc kép, có thể thêm “rằng”, “là”. Lỗi câu hay gặp: thiếu chủ ngữ vì mở đầu bằng “Qua…”, “Với…” rồi viết tiếp vị ngữ.',code:'Trực tiếp: Mẹ dặn: “Con nhớ học bài nhé.”\nGián tiếp: Mẹ dặn tôi nhớ học bài.'},qs:[
  {t:'mc',q:'Mẹ bảo: “Con nhớ học bài nhé.” Đây là cách dẫn nào?',o:['Dẫn trực tiếp','Dẫn gián tiếp','Không phải lời dẫn','Vừa trực tiếp vừa gián tiếp'],a:0,w:'Lời được giữ nguyên, đặt trong ngoặc kép sau dấu hai chấm.'},
  {t:'mc',q:'Câu nào chuyển đúng câu trên sang lời dẫn gián tiếp?',o:['Mẹ bảo tôi nhớ học bài.','Mẹ bảo: “Tôi nhớ học bài.”','Mẹ bảo “con nhớ học bài nhé”.','Mẹ: con nhớ học bài.'],a:0,w:'Bỏ ngoặc kép, đổi “con” thành “tôi”, bỏ từ cảm thán “nhé”.'},
  {t:'fill',q:'Điền tên dấu câu',code:'Lời dẫn trực tiếp được đặt trong dấu ___ và thường đứng sau dấu ___.',bank:['ngoặc kép','hai chấm','chấm phẩy','ngoặc đơn'],a:['ngoặc kép','hai chấm'],w:'Hai chấm báo hiệu lời dẫn, ngoặc kép đánh dấu phần lời được giữ nguyên.'},
  {t:'bug',q:'Chạm vào câu mắc lỗi ngữ pháp',lines:['Qua bài thơ cho thấy tình yêu quê hương của tác giả.','Bài thơ cho thấy tình yêu quê hương của tác giả.','Qua bài thơ, tác giả thể hiện tình yêu quê hương.','Em rất thích bài thơ này.'],a:0,w:'“Qua bài thơ” là trạng ngữ, nên câu thiếu chủ ngữ. Sửa bằng cách bỏ “Qua” hoặc thêm chủ ngữ “tác giả”.'},
  {t:'order',q:'Sắp xếp thành đoạn văn mạch lạc',lines:['Vũ Nương là người phụ nữ đức hạnh.','Ở nhà, nàng hết lòng chăm sóc mẹ chồng và nuôi con nhỏ.','Khi mẹ chồng mất, nàng lo ma chay chu đáo như với cha mẹ đẻ.','Thế nhưng, người phụ nữ ấy lại phải chịu nỗi oan khuất.'],w:'Câu chủ đề đứng đầu, các câu tiếp theo đi theo thời gian, từ “Thế nhưng” chuyển ý ở cuối.'}]}],
 boss:{q:'Viết đoạn văn (khoảng 150 chữ) về tình cảm gia đình, trong đó có dùng một lời dẫn trực tiếp và một phép nói giảm nói tránh. Ghi rõ hai chỗ đó ở cuối đoạn.',crit:'Đúng chủ đề tình cảm gia đình, có câu chủ đề; có một lời dẫn trực tiếp đúng hình thức (dấu hai chấm, ngoặc kép, giữ nguyên lời); có một phép nói giảm nói tránh đúng; chỉ ra đúng hai chỗ; diễn đạt mạch lạc, đúng chính tả.',sol:'Gợi ý (em tự viết thành đoạn):\n– Câu chủ đề: gia đình là nơi yêu thương, che chở mỗi người.\n– Một kỉ niệm cụ thể với ông bà, cha mẹ.\n– Lời dẫn trực tiếp: một câu nói của người thân, đặt sau dấu hai chấm, trong ngoặc kép.\n– Nói giảm nói tránh: cách nói tế nhị về điều buồn (ví dụ người thân đã khuất, hoặc một lỗi lầm của em).\n– Câu kết: điều em muốn làm cho gia đình.'}},

{t:'Viết văn nghị luận',s:'đoạn văn, luận điểm, nghị luận văn học, liên kết',c:'#3B4CCA',gl:'Luận điểm',lessons:[
 {card:{h:'Đoạn văn và bài nghị luận',p:'Bài nghị luận gồm luận đề, các luận điểm, lí lẽ và bằng chứng. Đoạn văn có câu chủ đề. Đoạn diễn dịch: câu chủ đề đứng đầu. Đoạn quy nạp: câu chủ đề đứng cuối. Đoạn tổng – phân – hợp: câu chủ đề ở đầu và được khẳng định lại ở cuối.'},qs:[
  {t:'mc',q:'Đoạn văn có câu chủ đề đứng đầu là đoạn gì?',o:['Diễn dịch','Quy nạp','Song song','Tổng – phân – hợp'],a:0,w:'Diễn dịch đi từ ý khái quát đến các ý cụ thể.'},
  {t:'mc',q:'“Bằng chứng” trong bài nghị luận là gì?',o:['Dẫn chứng cụ thể (sự việc, số liệu, câu thơ…) làm sáng tỏ lí lẽ','Ý kiến cá nhân không cần chứng minh','Câu mở bài','Lời kêu gọi'],a:0,w:'Lí lẽ cần bằng chứng để thuyết phục người đọc.'},
  {t:'order',q:'Sắp xếp bố cục bài nghị luận về một vấn đề cần giải quyết',lines:['Giới thiệu vấn đề cần giải quyết','Nêu thực trạng và nguyên nhân','Đề xuất giải pháp, kèm lí lẽ và bằng chứng','Khẳng định lại vấn đề, liên hệ bản thân'],w:'Mở bài nêu vấn đề, thân bài phân tích và đề xuất, kết bài khẳng định.'},
  {t:'bug',q:'Chạm vào lí lẽ KHÔNG phù hợp với luận điểm “Đọc sách giúp mở rộng hiểu biết”',lines:['Sách lưu giữ tri thức của nhân loại qua nhiều thế hệ','Đọc sách giúp ta biết về những vùng đất chưa từng đến','Sách giấy nặng nên khó mang theo','Qua sách, ta hiểu thêm về con người và lịch sử'],a:2,w:'Lí lẽ này không làm sáng tỏ luận điểm, thậm chí đi ngược hướng.'},
  {t:'fill',q:'Điền kiểu đoạn văn',code:'Đoạn văn ___ có câu chủ đề nằm ở cuối, khái quát các ý đã trình bày.',bank:['quy nạp','diễn dịch','song song','móc xích'],a:['quy nạp'],w:'Quy nạp đi từ các ý cụ thể đến kết luận khái quát.'}]},
 {card:{h:'Nghị luận văn học',p:'Khi phân tích tác phẩm, cần kết hợp nội dung với nghệ thuật, có dẫn chứng từ văn bản và nhận xét, đánh giá. Trích dẫn thơ đặt trong ngoặc kép; hai câu thơ viết liền thì ngăn bằng dấu gạch chéo. Tránh kể lại tác phẩm, tránh nhận xét chung chung.'},qs:[

 {deep:1,card:{h:'Đào sâu: liên kết và lập luận',p:'Các phép liên kết câu: lặp (lặp từ ngữ), thế (dùng từ ngữ thay thế), nối (dùng từ nối như nhưng, vì vậy, tuy nhiên), đồng nghĩa và liên tưởng. Lập luận chặt chẽ cần lí lẽ đúng, bằng chứng đủ; tránh vơ đũa cả nắm hay kết luận vội vàng.'},qs:[

 boss:{q:'Viết đoạn văn nghị luận xã hội (khoảng 200 chữ) trả lời câu hỏi: Học sinh nên làm gì để sử dụng mạng xã hội một cách lành mạnh?',crit:'Có câu chủ đề nêu rõ quan điểm; đưa ít nhất hai giải pháp cụ thể kèm lí lẽ (quản lí thời gian, chọn lọc thông tin, bảo vệ thông tin cá nhân, ứng xử văn minh…); có bằng chứng hoặc ví dụ thực tế; có phép liên kết hợp lí; câu kết liên hệ bản thân; diễn đạt mạch lạc, đúng chính tả.',sol:'Dàn ý gợi ý (em tự viết thành đoạn):\n– Câu chủ đề: mạng xã hội có ích nếu dùng đúng cách.\n– Giải pháp 1: đặt giới hạn thời gian, không dùng khi học và trước giờ ngủ.\n– Giải pháp 2: chọn lọc thông tin, kiểm tra nguồn trước khi tin và chia sẻ.\n– Giải pháp 3: giữ thông tin cá nhân, ứng xử lịch sự trên mạng.\n– Ví dụ thực tế ngắn gọn.\n– Câu kết: liên hệ việc em sẽ làm.'}}

 {card:{h:'Yếu tố Hán Việt dễ nhầm lẫn',p:'Nhiều yếu tố Hán Việt đọc giống nhau nhưng nghĩa khác nhau. Muốn hiểu đúng phải đặt vào từ cụ thể: "thiên" là trời (thiên nhiên), là nghìn (thiên niên kỉ), là lệch về một bên (thiên vị); "gia" là nhà (gia đình), là thêm (gia tăng); "tử" là con (phụ tử), là chết (tử trận).'},qs:[

 {card:{h:'Điệp thanh và điệp vần',p:'Điệp thanh là lặp lại các thanh cùng loại (cùng bằng hoặc cùng trắc) để tạo nhạc điệu, gợi cảm xúc. Thanh bằng gồm thanh ngang và thanh huyền; thanh trắc gồm sắc, hỏi, ngã, nặng. Chuỗi thanh bằng gợi sự êm ả, dàn trải; chuỗi thanh trắc gợi sự mạnh mẽ, trắc trở. Điệp vần là lặp lại những âm tiết có vần giống nhau, tạo âm hưởng trùng điệp.',code:'Sông xanh trôi êm đềm mênh mông   (toàn thanh bằng)\nSấm sét giật rạch nát cả đất   (toàn thanh trắc)'},qs:[

  {t:'mc',q:'Dòng "Sông xanh trôi êm đềm mênh mông" dùng toàn thanh bằng. Âm hưởng ấy gợi cảm giác gì?',o:['Êm ả, dàn trải','Dữ dội, gấp gáp','Đứt quãng, trắc trở','Vui nhộn, tinh nghịch'],a:0,w:'Thanh bằng ngân dài, nhẹ nên gợi sự êm đềm, mênh mang.'},
  {t:'mc',q:'Một dòng thơ toàn thanh trắc thường gợi điều gì?',o:['Sự mạnh mẽ, dữ dội hoặc trắc trở','Sự êm đềm','Sự nhẹ nhàng, thư thái','Sự chậm rãi, mơ màng'],a:0,w:'Thanh trắc ngắn, gắt, tạo cảm giác va đập.'},

 {deep:1,card:{h:'Câu rút gọn và câu đặc biệt',p:'Câu rút gọn lược bớt một số thành phần, có thể khôi phục dựa vào ngữ cảnh; giúp câu gọn, tránh lặp, hoặc ngụ ý hành động là của chung mọi người. Câu đặc biệt không cấu tạo theo mô hình chủ ngữ – vị ngữ, không khôi phục được; dùng để nêu thời gian, nơi chốn, liệt kê sự tồn tại, bộc lộ cảm xúc, gọi đáp.',code:'Rút gọn: – Bao giờ cậu về quê? – Ngày mai.\nĐặc biệt: Một đêm mùa xuân. / Trời ơi!'},qs:[
  {t:'mc',q:'"Học ăn, học nói, học gói, học mở." (tục ngữ) là kiểu câu gì?',o:['Câu rút gọn, lược chủ ngữ để nói chung cho mọi người','Câu đặc biệt','Câu bị động','Câu cảm thán'],a:0,w:'Có thể khôi phục: "Chúng ta cần học ăn, học nói…". Lược chủ ngữ để thành lời khuyên chung.'},
  {t:'mc',q:'"Một đêm mùa xuân." là kiểu câu gì và dùng để làm gì?',o:['Câu đặc biệt, nêu thời gian','Câu rút gọn, tránh lặp','Câu ghép, nêu nguyên nhân','Câu cầu khiến'],a:0,w:'Câu không có cấu trúc C–V và không khôi phục được; nó xác định thời gian cho sự việc.'},
  {t:'mc',q:'– Bao giờ cậu về quê? – Ngày mai. Câu "Ngày mai." là gì?',o:['Câu rút gọn','Câu đặc biệt','Câu ghép','Câu phủ định'],a:0,w:'Khôi phục được: "Ngày mai tớ về quê." Vì khôi phục được nên là câu rút gọn.'},

{t:'Câu ghép, câu bị động, tên viết tắt',s:'câu đơn – câu ghép, chủ động – bị động, tổ chức quốc tế',c:'#4B5FB0',gl:'C–V, C–V',lessons:[
 {card:{h:'Lựa chọn câu đơn, câu ghép',p:'Câu đơn có một cụm C–V nòng cốt; câu ghép có từ hai cụm C–V trở lên. Câu ghép đẳng lập có các vế ngang hàng; câu ghép chính phụ có vế chính, vế phụ, thường nối bằng cặp quan hệ từ: vì… nên (nguyên nhân – kết quả), nếu… thì (điều kiện – kết quả), tuy… nhưng (tương phản), càng… càng (tăng tiến). Ý đơn giản dùng câu đơn; nhiều ý có quan hệ chặt chẽ dùng câu ghép.',code:'Vì trời mưa nên đường trơn.\nTuy nhà xa, Lan vẫn đi học đúng giờ.'},qs:[
  {t:'mc',q:'"Vì trời mưa nên đường trơn." là câu ghép có quan hệ gì?',o:['Nguyên nhân – kết quả','Tương phản','Tăng tiến','Điều kiện – kết quả'],a:0,w:'Cặp "vì… nên" chỉ nguyên nhân – kết quả.'},
  {t:'fill',q:'Điền cặp từ để có quan hệ điều kiện – kết quả',code:'___ em chăm học ___ em sẽ tiến bộ.',bank:['Nếu','thì','Tuy','nhưng'],a:['Nếu','thì'],w:'"Nếu… thì" diễn tả điều kiện – kết quả.'},
  {t:'mc',q:'"Tuy nhà xa, Lan vẫn đi học đúng giờ." thể hiện quan hệ gì?',o:['Tương phản','Nguyên nhân – kết quả','Tăng tiến','Đồng thời'],a:0,w:'"Tuy… (vẫn/nhưng)" chỉ quan hệ tương phản.'},
  {t:'mc',q:'Câu ghép đẳng lập là câu thế nào?',o:['Các vế có quan hệ bình đẳng, ngang hàng','Có một vế chính và một vế phụ','Chỉ có một cụm C–V','Không có vị ngữ'],a:0,w:'Ví dụ: "Tôi đi học, mẹ tôi đi làm." Hai vế ngang hàng.'},
  {t:'mc',q:'Muốn diễn đạt nhiều ý có quan hệ chặt chẽ với nhau, nên chọn kiểu câu nào?',o:['Câu ghép','Câu đặc biệt','Câu rút gọn','Thán từ'],a:0,w:'Câu ghép cho thấy rõ quan hệ giữa các ý nhờ phương tiện nối.'}]},
 {card:{h:'Câu chủ động và câu bị động',p:'Câu chủ động có chủ ngữ chỉ người, vật thực hiện hành động. Câu bị động có chủ ngữ chỉ người, vật chịu tác động (thường có "bị", "được"). Chỉ gọi là câu bị động khi đổi được thành câu chủ động tương ứng. Dùng câu bị động để nhấn mạnh đối tượng chịu tác động hoặc để liên kết các câu trong đoạn.',code:'Chủ động: Người dân xây lại ngôi đền.\nBị động: Ngôi đền được người dân xây lại.'},qs:[
  {t:'mc',q:'"Ngôi đền được người dân xây lại." là câu gì?',o:['Câu bị động','Câu chủ động','Câu đặc biệt','Câu rút gọn'],a:0,w:'Chủ ngữ "ngôi đền" chịu tác động của hành động xây.'},

 {card:{h:'Thơ, kịch, nghị luận',p:'Tự tình (bài 2) của Hồ Xuân Hương là thơ Nôm thất ngôn bát cú Đường luật. Bài thơ Lý Bạch tiễn Mạnh Hạo Nhiên ở lầu Hoàng Hạc là thơ thất ngôn tứ tuyệt. Rô-mê-ô và Giu-li-ét của Sếch-xpia là bi kịch. Đấu tranh cho một thế giới hòa bình của G. G. Mác-két là văn bản nghị luận cảnh báo nguy cơ chiến tranh hạt nhân.',code:'Đêm khuya văng vẳng trống canh dồn,\nTrơ cái hồng nhan với nước non.\n(Hồ Xuân Hương)'},qs:[

/* ===== Ôn thi vào 10 — Ngữ văn: hệ thống lí thuyết + luyện tập ===== */
const hbT=(head,rows)=>`<div class="hb-tw"><table class="hb-t"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const hbFlow=steps=>`<div class="hb-flow">${steps.map((s,i)=>`<div class="hb-step"><span class="n">${i+1}</span><div><b>${s[0]}</b>${s[1]?`<p>${s[1]}</p>`:''}</div></div>`).join('')}</div>`;
const hbBox=(t,b,cls='')=>`<div class="hb-box ${cls}"><b>${t}</b><p>${b}</p></div>`;
const hbCards=items=>`<div class="hb-cards">${items.map(([n,d,e,u])=>`<div class="hb-c"><b>${n}</b><p>${d}</p>${e?`<div class="ex">${e}</div>`:''}${u?`<div class="use">→ ${u}</div>`:''}</div>`).join('')}</div>`;
const hbTree=(root,branches)=>`<div class="hb-tree"><div class="root">${root}</div><div class="br">${branches.map(([b,leaves])=>`<div class="tnode"><div class="lbl">${b}</div>${leaves.map(l=>`<div class="leaf">${l}</div>`).join('')}</div>`).join('')}</div></div>`;
function hbLucBat(){
  const L=[['Mẹ','ngồi','vá','áo','bên','thềm'],['Đường','kim','nối','những','ngày','êm','tháng','dài'],['Con','đi','xa','vẫn','nhớ','hoài'],['Bàn','tay','mẹ','ấm','như','ngoài','nắng','xuân']];
  const mark={'0-5':'ra','1-5':'ra','1-7':'rb','2-5':'rb','3-5':'rb'}, tone={1:'B',3:'T',5:'B',7:'B'};
  return `<div class="hb-lb">${L.map((row,r)=>`<div class="row">${row.map((w,i)=>`<div class="syl ${mark[r+'-'+i]||''}"><span>${w}</span><i>${tone[i]||''}</i></div>`).join('')}</div>`).join('')}</div>
  <p class="hb-cap"><span class="dot ra"></span>"thềm" vần "êm" · <span class="dot rb"></span>"dài" vần "hoài", "hoài" vần "ngoài". Hàng chữ nhỏ: tiếng 2 – 4 – 6 (– 8) theo luật Bằng – Trắc – Bằng (– Bằng).</p>`;
}
function hbSTLB(){
  const rows=[[7,{6:'ra'}],[7,{4:'ra',6:'rb'}],[6,{5:'rb'}],[8,{5:'rb'}]];
  return `<div class="hb-lb">${rows.map(([n,m],r)=>`<div class="row">${Array.from({length:n},(_,i)=>`<div class="syl ${m[i]||''}"><span>${i+1}</span></div>`).join('')}<em>${['Thất','Thất','Lục','Bát'][r]}</em></div>`).join('')}</div>
  <p class="hb-cap"><span class="dot ra"></span>Chữ 7 câu thất đầu (trắc) vần chữ 5 câu thất sau · <span class="dot rb"></span>chữ 7 câu thất sau (bằng) vần chữ 6 câu lục, chữ 6 câu lục vần chữ 6 câu bát.</p>`;
}
function hbDuong(){
  const parts=[['Đề','1','2','Mở ý, nêu vấn đề'],['Thực','3','4','Triển khai ý · <b>đối</b>'],['Luận','5','6','Mở rộng, bàn luận · <b>đối</b>'],['Kết','7','8','Khép lại, thâu tóm ý']];
  return `<div class="hb-duong">${parts.map(p=>`<div class="pt"><div class="nm">${p[0]}</div><div class="ln"><span>Câu ${p[1]}</span><span>Câu ${p[2]}</span></div><div class="ds">${p[3]}</div></div>`).join('')}</div>
  <p class="hb-cap">Vần bằng ở cuối câu 1, 2, 4, 6, 8. Niêm: 1–8, 2–3, 4–5, 6–7. Nhịp thường 4/3.</p>`;
}
function hbParas(){
  const P=(n,cells,d)=>`<div class="hb-para"><div class="bar">${cells.map(c=>`<i class="${c}"></i>`).join('')}</div><b>${n}</b><p>${d}</p></div>`;
  return `<div class="hb-paras">${P('Diễn dịch',['cd','','','',''],'Câu chủ đề đứng đầu, các câu sau triển khai.')}${P('Quy nạp',['','','','','cd'],'Các ý cụ thể trước, câu chủ đề chốt ở cuối.')}${P('Tổng – phân – hợp',['cd','','','','cd'],'Nêu ở đầu, khẳng định lại ở cuối.')}${P('Song song',['eq','eq','eq','eq','eq'],'Không có câu chủ đề, các câu ngang hàng.')}</div>`;
}
function hbSentence(){
  return `<div class="hb-sent"><span class="tn">Trạng ngữ</span><span class="cm">,</span><span class="cn">Chủ ngữ</span><span class="sl">//</span><span class="vn">Vị ngữ</span></div>
  <div class="hb-sent ex"><span class="tn">Mùa xuân</span><span class="cm">,</span><span class="cn">cây cối</span><span class="sl">//</span><span class="vn">đâm chồi nảy lộc</span></div>
  <div class="hb-chips"><span>Tình thái: chắc chắn, có lẽ, hình như</span><span>Cảm thán: ôi, chao ôi, trời ơi</span><span>Phụ chú: giữa 2 dấu gạch ngang, phẩy, ngoặc đơn</span><span>Gọi – đáp: này, ơi, vâng, dạ</span></div>
  <p class="hb-cap">Bốn thành phần biệt lập không tham gia diễn đạt nghĩa sự việc của câu: bỏ đi thì nghĩa sự việc không đổi.</p>`;
}
function hbPyramid(){
  return `<div class="hb-pyr"><div class="t3"><b>Vận dụng</b>bài học, thông điệp, đồng ý không, em sẽ làm gì</div><div class="t2"><b>Thông hiểu</b>chủ đề, ý nghĩa chi tiết, tác dụng ngôi kể, tác dụng biện pháp tu từ</div><div class="t1"><b>Nhận biết</b>thể loại, ngôi kể, nhân vật chính, tình huống, đề tài, lời người kể – lời nhân vật</div></div>`;
}
